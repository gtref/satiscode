name: Greetings

on:
  issues:
  pull_request_target:

jobs:
  greeting:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            🎉 Thanks for opening your first issue in **satiscode**!

            We appreciate you taking the time to help improve the project.
            Feel free to ask questions, suggest ideas, or report bugs — we’re happy to have you here.

          pr-message: |
            🚀 Thanks for submitting your first pull request to **satiscode**!

            Your contribution means a lot. A maintainer will review it soon.
            In the meantime, feel free to join discussions or check out other issues.
