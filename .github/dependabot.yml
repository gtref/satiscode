version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "actions"

  # Maintain root npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "npm"

  # Maintain FIXSON-LSP package dependencies
  - package-ecosystem: "npm"
    directory: "/packages/FIXSON-LSP"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(fixson)"
    labels:
      - "dependencies"
      - "lsp"

  # Maintain FIXML-LSP package dependencies
  - package-ecosystem: "npm"
    directory: "/packages/FIXML-LSP"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(fixml)"
    labels:
      - "dependencies"
      - "lsp"
