<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               font-src 'self' data:;
               script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:;
               worker-src blob: data:;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;">

  <title>Satiscode</title>
  <link rel="stylesheet" href="styles/style1.css">
  <link rel="stylesheet" href="node_modules/monaco-editor/min/vs/editor/editor.main.css">
  <script type="module">
    import { initIcons, getFileIcon, getFolderIcon, getChevronIcon } from './icons.js';
    import { loadTheme, applyTheme, getAvailableThemes } from './themes.js'; 
    import { TabManager } from './UI/tab_manager/tabman.js';

    // Attach getters to window for internal renderer access immediately
    window.getFileIcon = getFileIcon;
    window.getFolderIcon = getFolderIcon;
    window.getChevronIcon = getChevronIcon;

    // Attach theme functions for internal renderer access
    window.loadTheme = loadTheme;
    window.applyTheme = applyTheme;
    window.getAvailableThemes = getAvailableThemes;

    const savedTheme = localStorage.getItem('satiscode-theme') || 'dark';
    document.getElementById('theme-select').value = savedTheme;
    await applyTheme(savedTheme);
    window.TabManager = TabManager;

    // Initialize local icon system from icons/style1/icons.json
    await initIcons();
  </script>
</head>
<body>
  <div id="toolbar">
    <button id="new-btn" data-i18n="newFile">New</button>
    <button id="open-btn" data-i18n="openFile">Open</button>
    <button id="open-folder-btn">Open Folder</button>
    <button id="save-btn" data-i18n="saveFile">Save</button>
    <button id="save-as-btn" data-i18n="saveAs">Save As</button>
    <button id="find-btn" data-i18n="find">Find</button>
    <button id="exit-btn" data-i18n="exit">Exit</button>
    <div id="source-language-menu">
      <button id="source-language-btn" aria-haspopup="true" aria-expanded="false"><span class="language-badge">◇</span><span id="source-language-label">Auto</span> ▾</button>
      <div id="source-language-options" hidden>
        <button class="source-language-option" data-source-language="auto"><span class="language-badge">↯</span>Auto</button>
        <button class="source-language-option" data-source-language="c"><span class="language-badge">C</span>C</button>
        <button class="source-language-option" data-source-language="cpp"><span class="language-badge">C++</span>C++</button>
        <button class="source-language-option" data-source-language="css"><span class="language-badge">#</span>CSS</button>
        <button class="source-language-option" data-source-language="javascript"><span class="language-badge">JS</span>JavaScript</button>
        <button class="source-language-option" data-source-language="html"><span class="language-badge">&lt;&gt;</span>HTML</button>
        <button class="source-language-option" data-source-language="typescript"><span class="language-badge">TS</span>TypeScript</button>
        <button class="source-language-option" data-source-language="json"><span class="language-badge">{ }</span>JSON</button>
        <button class="source-language-option" data-source-language="plaintext"><span class="language-badge">Aa</span>Plain Text</button>
        <button class="source-language-option" data-source-language="python"><span class="language-badge">Py</span>Python</button>
      </div>
    </div>
    <select id="theme-select" aria-label="Interface Theme">
      <option value="dark">Dark Theme</option>
      <option value="light">Light Theme</option>
      <!--<option value="hc">High Contrast</option>-->
    </select>
    <select id="language-select" aria-label="Interface language">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
    <span id="status">clangd: idle</span>
    <span id="ideStatus">
      <span class="status-indicator"></span>
      satiscode: Operational
    </span>
  </div>
  <div id="content">
    <aside id="file-tree">
      <div id="tree-header" data-i18n="explorer">Explorer</div>
      <div id="tree-root"></div>
    </aside>
    <aside id="git-sidebar" aria-label="Git controls">
      <div id="git-sidebar-mount"></div>
    </aside>
    <div id="workspace">
      <div id="tab-bar" class="tab-bar"></div>
      <div id="editor"></div>
      <section id="problems-panel" aria-label="Problems">
        <div id="problems-resizer" title="Resize Problems panel"></div>
        <div id="problems-header">
          <span id="problems-title" data-i18n="problems">Problems</span>
          <span id="problems-count">0</span>
        </div>
        <div id="problems-list"><div id="no-problems" data-i18n="noProblems">No problems detected.</div></div>
      </section>
    </div>
  </div>

  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { 'vs': 'node_modules/monaco-editor/min/vs' } });

window.MonacoEnvironment = {
  getWorkerUrl: function (moduleId, label) {
    const code = `
      self.MonacoEnvironment = { baseUrl: './node_modules/monaco-editor/min/' };
      importScripts('./node_modules/monaco-editor/min/vs/base/worker/workerMain.js');
    `;
    const blob = new Blob([code], { type: 'application/javascript' });
    return URL.createObjectURL(blob);
  }
};


    require(['vs/editor/editor.main'], function (monaco) {
      window.monaco = monaco;

      window.addEventListener('error', (event) => {
        if (event.message?.includes('ResizeObserver loop completed with undelivered notifications')) {
          event.stopImmediatePropagation();
          return;
        }
        console.error(`Uncaught renderer error: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`, event.error?.stack || '');
      });
      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled renderer promise rejection:', event.reason?.stack || event.reason);
      });

      // Open Folder Event
      document.getElementById('open-folder-btn').addEventListener('click', async () => {
        const folderPath = await window.api.openFolder();
        if (folderPath) {
          currentDirectory = folderPath;
          await refreshFileTree(folderPath);
        }
      });

      let currentFilePath = null;
      let clangdRequestId = 0;
      let pyrightRequestId = 0;
      let documentVersion = 1;
      let changeTimeout = null;
      const clangdPendingRequests = new Map();
      const pyrightPendingRequests = new Map();
      let clangdStarted = false;
      let pyrightStarted = false;
      let currentDirectory = null;
      let manualLanguage = null;
      let currentDocumentUri = null;
      const cppExtensions = new Set(['.c', '.cc', '.cpp', '.cxx', '.h', '.hh', '.hpp', '.hxx']);
      const languageByExtension = new Map([
        ['.html', 'html'], ['.htm', 'html'], ['.css', 'css'], ['.scss', 'scss'],
        ['.js', 'javascript'], ['.jsx', 'javascript'], ['.mjs', 'javascript'], ['.cjs', 'javascript'],
        ['.ts', 'typescript'], ['.tsx', 'typescript'], ['.json', 'json'], ['.jsonc', 'json'],
        ['.py', 'python']
      ]);
      const translations = {
        en: { newFile: 'New', openFile: 'Open', saveFile: 'Save', saveAs: 'Save As', find: 'Find', exit: 'Exit', explorer: 'Explorer', problems: 'Problems', noProblems: 'No problems detected.' },
        es: { newFile: 'Nuevo', openFile: 'Abrir', saveFile: 'Guardar', saveAs: 'Guardar como', find: 'Buscar', exit: 'Salir', explorer: 'Explorador', problems: 'Problemas', noProblems: 'No se detectaron problemas.' }
      };

      const extensionForPath = (filePath) => {
        const fileName = filePath.split(/[\\/]/).pop() || '';
        const extensionIndex = fileName.lastIndexOf('.');
        return extensionIndex >= 0 ? fileName.slice(extensionIndex).toLowerCase() : '';
      };
      const isCppFile = (filePath) => cppExtensions.has(extensionForPath(filePath));
      const languageForPath = (filePath) => {
        const extension = extensionForPath(filePath);
        if (extension === '.c') return 'c';
        if (cppExtensions.has(extension)) return 'cpp';
        return languageByExtension.get(extension) || 'plaintext';
      };
      const hasEditorLanguage = (filePath) => isCppFile(filePath) || languageByExtension.has(extensionForPath(filePath));
      const activeLanguage = (filePath) => manualLanguage || languageForPath(filePath || '');
      const isActiveCppLanguage = () => activeLanguage(currentFilePath) === 'c' || activeLanguage(currentFilePath) === 'cpp';
      const isActivePythonLanguage = () => activeLanguage(currentFilePath) === 'python';
      const pathToUri = (filePath) => {
        const normalized = filePath.replace(/\\/g, '/');
        return encodeURI(`file://${normalized.startsWith('/') ? '' : '/'}${normalized}`);
      };
      const virtualDocumentUri = (workspacePath, language) => {
        const ext = language === 'c' ? 'c' : language === 'cpp' ? 'cpp' : language === 'python' ? 'py' : 'txt';
        return pathToUri(`${workspacePath}\\untitled.${ext}`);
      };
      const positionToLsp = (position) => ({ line: position.lineNumber - 1, character: position.column - 1 });
      const rangeToMonaco = (range) => ({
        startLineNumber: range.start.line + 1,
        startColumn: range.start.character + 1,
        endLineNumber: range.end.line + 1,
        endColumn: range.end.character + 1
      });
      let currentProblems = [];

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
      }

      function renderProblems() {
        const list = document.getElementById('problems-list');
        const count = document.getElementById('problems-count');
        count.textContent = String(currentProblems.length);

        list.innerHTML = currentProblems.length ? currentProblems.map((problem, index) => {
          const severityClass = problem.severity === monaco.MarkerSeverity.Warning ? ' warning' : '';
          const icon = problem.severity === monaco.MarkerSeverity.Warning ? '!' : '×';
          return `<div class="problem${severityClass}" data-problem-index="${index}">
            <span class="problem-icon">${icon}</span>
            <span class="problem-message">${escapeHtml(problem.message)}</span>
            <span class="problem-location">${problem.startLineNumber}:${problem.startColumn}</span>
          </div>`;
        }).join('') : '<div id="no-problems">No problems detected.</div>';

        list.querySelectorAll('.problem').forEach((element) => {
          element.addEventListener('click', () => {
            const problem = currentProblems[Number(element.dataset.problemIndex)];
            if (!problem) return;
            window.editor.setPosition({ lineNumber: problem.startLineNumber, column: problem.startColumn });
            window.editor.revealLineInCenter(problem.startLineNumber);
            window.editor.focus();
          });
        });
      }

      function clearProblems() {
        currentProblems = [];
        renderProblems();
        if (window.editor) {
          monaco.editor.setModelMarkers(window.editor.getModel(), 'clangd', []);
          monaco.editor.setModelMarkers(window.editor.getModel(), 'pyright', []);
        }
      }

      function setSatiscodeStatus(state, message) {
        const status = document.getElementById('ideStatus');
        const indicator = status?.querySelector('.status-indicator');

        if (!status || !indicator) return;

        status.dataset.state = state;

        const labels = {
          operational: 'satiscode: Operational',
          starting: 'satiscode: Starting',
          error: 'satiscode: Error',
          offline: 'satiscode: Offline'
        };

        status.lastChild.textContent = ` ${message || labels[state] || labels.operational}`;
      }

      function applyInterfaceLanguage(language) {
        const labels = translations[language] || translations.en;
        document.querySelectorAll('[data-i18n]').forEach((element) => {
          element.textContent = labels[element.dataset.i18n] || element.textContent;
        });
        document.getElementById('language-select').value = translations[language] ? language : 'en';
      }

      function updateSourceLanguageLabel() {
        const language = activeLanguage(currentFilePath);
        const labels = { auto: 'Auto', c: 'C', cpp: 'C++', css: 'CSS', javascript: 'JavaScript', html: 'HTML', typescript: 'TypeScript', json: 'JSON', python: 'Python', plaintext: 'Plain Text' };
        const icons = { auto: '◇', c: 'C', cpp: 'C++', css: '#', javascript: 'JS', html: '<>', typescript: 'TS', json: '{}', python: 'Py', plaintext: 'Aa' };
        document.getElementById('source-language-label').textContent = labels[language] || labels.auto;
        document.querySelector('#source-language-btn .language-badge').textContent = icons[language] || icons.auto;
      }

      function stopLanguageServers() {
        if (clangdStarted) {
          if (currentDocumentUri) sendClangdNotification('textDocument/didClose', { textDocument: { uri: currentDocumentUri } });
          window.api.stopClangd();
          clangdStarted = false;
        }
        if (pyrightStarted) {
          if (currentDocumentUri) sendPyrightNotification('textDocument/didClose', { textDocument: { uri: currentDocumentUri } });
          window.api.stopPyright();
          pyrightStarted = false;
        }
      }

      function applySourceLanguage(language) {
        manualLanguage = language === 'auto' ? null : language;
        const selectedLanguage = activeLanguage(currentFilePath);
        
        monaco.editor.setModelLanguage(window.editor.getModel(), selectedLanguage);
        updateSourceLanguageLabel();

        if (isActiveCppLanguage()) {
          if (pyrightStarted) {
            if (currentDocumentUri) sendPyrightNotification('textDocument/didClose', { textDocument: { uri: currentDocumentUri } });
            window.api.stopPyright();
            pyrightStarted = false;
          }
          startClangdServer();
        } else if (isActivePythonLanguage()) {
          if (clangdStarted) {
            if (currentDocumentUri) sendClangdNotification('textDocument/didClose', { textDocument: { uri: currentDocumentUri } });
            window.api.stopClangd();
            clangdStarted = false;
          }
          startPyrightServer();
        } else {
          stopLanguageServers();
          clearProblems();
          document.getElementById('status').textContent = selectedLanguage === 'plaintext' ? 'language: plaintext' : 'language: ready';
        }
      }

      async function renderDirectory(directoryPath, container) {
        container.innerHTML = '';
        const entries = await window.api.listDirectory(directoryPath);
        entries.forEach((entry) => {
          const row = document.createElement('div');
          row.className = 'tree-entry';
          row.title = entry.path;
          
          const chevron = document.createElement('span');
          chevron.className = 'tree-chevron';
          chevron.innerHTML = entry.isDirectory ? window.getChevronIcon(false) : '';
          
          const icon = document.createElement('span');
          icon.className = 'tree-icon';
          icon.innerHTML = entry.isDirectory ? window.getFolderIcon(false) : window.getFileIcon(entry.name);
          
          const label = document.createElement('span');
          label.textContent = entry.name;
          
          row.append(chevron, icon, label);
          container.appendChild(row);
          
          if (entry.isDirectory) {
            const children = document.createElement('div');
            children.className = 'tree-children';
            children.hidden = true;
            
            row.addEventListener('click', async () => {
              children.hidden = !children.hidden;
              chevron.innerHTML = window.getChevronIcon(!children.hidden);
              icon.innerHTML = window.getFolderIcon(!children.hidden);
              
              if (!children.hidden && !children.dataset.loaded) {
                children.dataset.loaded = 'true';
                await renderDirectory(entry.path, children);
              }
            });
            container.appendChild(children);
          } else {
            row.addEventListener('click', async () => {
              const file = await window.api.readFile(entry.path);
              await openLoadedFile(file);
            });
          }
        });
      }

      let untitledCounter = 1;

      function createNewTab() {
        manualLanguage = null;
        const title = `Untitled-${untitledCounter++}`;
        const model = monaco.editor.createModel('', 'plaintext');
        tabManager.openTab(null, model, title);
      }

      const tabManager = new window.TabManager(
    document.getElementById('tab-bar'),
    (tab) => {
      const previousDocumentUri = currentDocumentUri;
      if (changeTimeout) {
        clearTimeout(changeTimeout);
        changeTimeout = null;
      }
      if (previousDocumentUri) {
        if (clangdStarted) {
          sendClangdNotification('textDocument/didClose', { textDocument: { uri: previousDocumentUri } });
        }
        if (pyrightStarted) {
          sendPyrightNotification('textDocument/didClose', { textDocument: { uri: previousDocumentUri } });
        }
      }

      if (tab) {
        currentFilePath = tab.filePath;
        currentDocumentUri = tab.filePath ? pathToUri(tab.filePath) : null;
        documentVersion = 1;
        window.editor.setModel(tab.model);
        updateSourceLanguageLabel();

        if (isActiveCppLanguage()) {
          if (pyrightStarted) {
            window.api.stopPyright();
            pyrightStarted = false;
          }
          if (clangdStarted && currentDocumentUri) {
            sendClangdNotification('textDocument/didOpen', {
              textDocument: {
                uri: currentDocumentUri,
                languageId: activeLanguage(currentFilePath),
                version: documentVersion,
                text: window.editor.getValue()
              }
            });
            document.getElementById('status').textContent = 'clangd: ready';
          } else {
            if (clangdStarted) {
              window.api.stopClangd();
              clangdStarted = false;
            }
            startClangdServer();
          }
        } else if (isActivePythonLanguage()) {
          if (clangdStarted) {
            window.api.stopClangd();
            clangdStarted = false;
          }
          if (pyrightStarted && currentDocumentUri) {
            sendPyrightNotification('textDocument/didOpen', {
              textDocument: {
                uri: currentDocumentUri,
                languageId: 'python',
                version: documentVersion,
                text: window.editor.getValue()
              }
            });
            document.getElementById('status').textContent = 'pyright: ready';
          } else {
            if (pyrightStarted) {
              window.api.stopPyright();
              pyrightStarted = false;
            }
            startPyrightServer();
          }
        } else {
          stopLanguageServers();
          clearProblems();
          document.getElementById('status').textContent = hasEditorLanguage(currentFilePath || '') ? 'language: ready' : 'language: plaintext';
        }
      } else {
        currentFilePath = null;
        currentDocumentUri = null;
        documentVersion = 1;
        stopLanguageServers();
        clearProblems();
        const emptyModel = monaco.editor.createModel('', 'plaintext');
        window.editor.setModel(emptyModel);
        document.getElementById('status').textContent = 'language: plaintext';
      }
    },
    (tab) => saveTab(tab)
  );

  // Bind '+' button from tabman.js
  tabManager.onNewTabRequest = () => createNewTab();

      async function refreshFileTree(directoryPath) {
      if (!directoryPath) {
        currentDirectory = null;
        await window.api.setGitWorkspace(null);
        return;
      }
      currentDirectory = directoryPath;
      await window.api.setGitWorkspace(directoryPath);
      await renderDirectory(directoryPath, document.getElementById('tree-root'));
    }

      async function openLoadedFile(file) {
    if (!file) return;

    const filePath = file.path || '';
    const content = file.content ?? '';
    const fileName = filePath ? filePath.split(/[\\/]/).pop() : 'Untitled';

    const existingTab = filePath ? tabManager.getTabByFilePath(filePath) : null;
    if (existingTab) {
      tabManager.setActive(existingTab.id);
    } else {
      const lang = activeLanguage(filePath);
      const uri = filePath ? monaco.Uri.file(filePath) : undefined;

      let model = uri ? monaco.editor.getModel(uri) : null;
      if (!model) {
        model = monaco.editor.createModel(content, lang, uri);
      } else {
        model.setValue(content);
      }

      tabManager.openTab(filePath, model, fileName);
    }

    if (filePath) {
      const lastSeparator = Math.max(filePath.lastIndexOf('\\'), filePath.lastIndexOf('/'));
      if (lastSeparator !== -1) {
        currentDirectory = filePath.substring(0, lastSeparator);
        await refreshFileTree(currentDirectory);
      }
    }
  }

      function sendClangdRequest(method, params) {
        const id = ++clangdRequestId;
        window.api.sendClangdMessage({ jsonrpc: '2.0', id, method, params });
        return new Promise((resolve, reject) => clangdPendingRequests.set(id, { resolve, reject }));
      }

      function sendClangdNotification(method, params) {
        window.api.sendClangdMessage({ jsonrpc: '2.0', method, params });
      }

      function sendPyrightRequest(method, params) {
        const id = ++pyrightRequestId;
        window.api.sendPyrightMessage({ jsonrpc: '2.0', id, method, params });
        return new Promise((resolve, reject) => pyrightPendingRequests.set(id, { resolve, reject }));
      }

      function sendPyrightNotification(method, params) {
        window.api.sendPyrightMessage({ jsonrpc: '2.0', method, params });
      }

      function sendRequest(method, params) {
        if (isActivePythonLanguage()) return sendPyrightRequest(method, params);
        return sendClangdRequest(method, params);
      }

      function sendNotification(method, params) {
        if (isActivePythonLanguage()) return sendPyrightNotification(method, params);
        return sendClangdNotification(method, params);
      }

      async function startClangdServer() {
        if (!isActiveCppLanguage()) return;
        if (clangdStarted) window.api.stopClangd();
        clangdStarted = true;
        document.getElementById('status').textContent = 'clangd: starting';
        const language = activeLanguage(currentFilePath);
        const workspacePath = currentDirectory || await window.api.getWorkspacePath();
        const rootPath = currentFilePath ? currentFilePath.substring(0, Math.max(currentFilePath.lastIndexOf('\\'), currentFilePath.lastIndexOf('/'))) : workspacePath;
        currentDocumentUri = currentDocumentUri || virtualDocumentUri(workspacePath, language);
        console.info(`Starting clangd for ${currentDocumentUri} as ${language}`);
        window.api.startClangd(rootPath || undefined).then(() => sendClangdRequest('initialize', {
            processId: null,
            rootUri: pathToUri(rootPath),
            capabilities: {
              textDocument: {
                synchronization: { didSave: true },
                completion: { completionItem: { snippetSupport: true } },
                hover: { contentFormat: ['markdown', 'plaintext'] },
                definition: {}
              }
            }
          })).then(() => {
          sendClangdNotification('initialized', {});
          sendClangdNotification('textDocument/didOpen', {
            textDocument: { uri: currentDocumentUri, languageId: language, version: documentVersion, text: window.editor.getValue() }
          });
          document.getElementById('status').textContent = 'clangd: ready';
        }).catch((error) => {
          clangdStarted = false;
          console.warn(`clangd is unavailable. C/C++ editing will continue without language services: ${error.message || error}`);
          document.getElementById('status').textContent = 'clangd: unavailable';
        });
      }

      async function startPyrightServer() {
        if (!isActivePythonLanguage()) return;
        if (pyrightStarted) window.api.stopPyright();
        pyrightStarted = true;
        document.getElementById('status').textContent = 'pyright: starting';
        const language = 'python';
        const workspacePath = currentDirectory || await window.api.getWorkspacePath();
        const rootPath = currentFilePath ? currentFilePath.substring(0, Math.max(currentFilePath.lastIndexOf('\\'), currentFilePath.lastIndexOf('/'))) : workspacePath;
        currentDocumentUri = currentDocumentUri || virtualDocumentUri(workspacePath, language);
        console.info(`Starting pyright for ${currentDocumentUri} as ${language}`);
        window.api.startPyright(rootPath || undefined).then(() => sendPyrightRequest('initialize', {
            processId: null,
            rootUri: pathToUri(rootPath),
            capabilities: {
              textDocument: {
                synchronization: { didSave: true },
                completion: { completionItem: { snippetSupport: true } },
                hover: { contentFormat: ['markdown', 'plaintext'] },
                definition: {}
              }
            }
          })).then(() => {
          sendPyrightNotification('initialized', {});
          sendPyrightNotification('textDocument/didOpen', {
            textDocument: { uri: currentDocumentUri, languageId: language, version: documentVersion, text: window.editor.getValue() }
          });
          document.getElementById('status').textContent = 'pyright: ready';
        }).catch((error) => {
          pyrightStarted = false;
          console.warn(`pyright is unavailable. Python editing will continue without language services: ${error.message || error}`);
          document.getElementById('status').textContent = 'pyright: unavailable';
        });
      }

      function startLanguageServer() {
        if (isActiveCppLanguage()) return startClangdServer();
        if (isActivePythonLanguage()) return startPyrightServer();
      }

    const monacoBaseUrl = new URL('node_modules/monaco-editor/min/', window.location.href).href;
    window.MonacoEnvironment = {
      getWorkerUrl: () => `data:text/javascript;charset=utf-8,${encodeURIComponent(`
        self.MonacoEnvironment = { baseUrl: '${monacoBaseUrl}' };
        importScripts('${monacoBaseUrl}vs/base/worker/workerMain.js');
      `)}`
    };
    require.config({ paths: { 'vs': `${monacoBaseUrl}vs` }});
    require(['vs/editor/editor.main'], function() {
      const MONACO_THEME_MAP = { dark: 'vs-dark', light: 'vs' };
      const savedThemeId = localStorage.getItem('satiscode-theme') || 'dark';

      window.editor = monaco.editor.create(document.getElementById('editor'), {
        value: '// Start typing CMM code or JS here...\n',
        language: 'plaintext',
        theme: MONACO_THEME_MAP[savedThemeId] || 'vs-dark',
        automaticLayout: true
      });

      createNewTab();

      window.api.onClangdMessage((message) => {
        if (message.id !== undefined && clangdPendingRequests.has(message.id)) {
          const request = clangdPendingRequests.get(message.id);
          clangdPendingRequests.delete(message.id);
          if (message.error) request.reject(message.error); else request.resolve(message.result);
        }
        if (message.method === 'textDocument/publishDiagnostics') {
          currentProblems = (message.params.diagnostics || []).map((diagnostic) => ({
            ...rangeToMonaco(diagnostic.range),
            message: diagnostic.message,
            severity: diagnostic.severity === 1 ? monaco.MarkerSeverity.Error : diagnostic.severity === 2 ? monaco.MarkerSeverity.Warning : monaco.MarkerSeverity.Info,
            source: 'clangd'
          }));
          monaco.editor.setModelMarkers(window.editor.getModel(), 'clangd', currentProblems);
          renderProblems();
        }
      });
      window.api.onClangdError((message) => {
        clangdStarted = false;
        clangdPendingRequests.forEach((request) => request.reject(new Error(message)));
        clangdPendingRequests.clear();
        console.warn(`clangd is unavailable. C/C++ editing will continue without language services: ${message}`);
        document.getElementById('status').textContent = 'clangd: unavailable';
      });
      window.api.onClangdStderr((message) => console.warn(`clangd: ${message.trim()}`));

      window.api.onPyrightMessage((message) => {
        if (message.id !== undefined && pyrightPendingRequests.has(message.id)) {
          const request = pyrightPendingRequests.get(message.id);
          pyrightPendingRequests.delete(message.id);
          if (message.error) request.reject(message.error); else request.resolve(message.result);
        }
        if (message.method === 'textDocument/publishDiagnostics') {
          const diagUri = message.params?.uri;
          if (currentDocumentUri && diagUri && diagUri.toLowerCase() !== currentDocumentUri.toLowerCase()) {
            return;
          }
          currentProblems = (message.params?.diagnostics || []).map((diagnostic) => ({
            ...rangeToMonaco(diagnostic.range),
            message: diagnostic.message,
            severity: diagnostic.severity === 1 ? monaco.MarkerSeverity.Error : diagnostic.severity === 2 ? monaco.MarkerSeverity.Warning : monaco.MarkerSeverity.Info,
            source: 'pyright'
          }));
          monaco.editor.setModelMarkers(window.editor.getModel(), 'pyright', currentProblems);
          renderProblems();
        }
      });
      window.api.onPyrightError((message) => {
        pyrightStarted = false;
        pyrightPendingRequests.forEach((request) => request.reject(new Error(message)));
        pyrightPendingRequests.clear();
        console.warn(`pyright is unavailable. Python editing will continue without language services: ${message}`);
        document.getElementById('status').textContent = 'pyright: unavailable';
      });
      window.api.onPyrightStderr((message) => console.warn(`pyright: ${message.trim()}`));
      window.api.onPyrightExit(() => {
        pyrightStarted = false;
      });
      applyInterfaceLanguage('en');
      updateSourceLanguageLabel();
      setSatiscodeStatus('operational');

      document.getElementById('source-language-btn').addEventListener('click', () => {
        const options = document.getElementById('source-language-options');
        options.hidden = !options.hidden;
        document.getElementById('source-language-btn').setAttribute('aria-expanded', String(!options.hidden));
      });
      document.querySelectorAll('[data-source-language]').forEach((option) => {
        option.addEventListener('click', () => {
          applySourceLanguage(option.dataset.sourceLanguage);
          document.getElementById('source-language-options').hidden = true;
          document.getElementById('source-language-btn').setAttribute('aria-expanded', 'false');
        });
      });
      document.addEventListener('click', (event) => {
        if (!document.getElementById('source-language-menu').contains(event.target)) {
          document.getElementById('source-language-options').hidden = true;
          document.getElementById('source-language-btn').setAttribute('aria-expanded', 'false');
        }
      });

      ['c', 'cpp'].forEach((language) => {
        monaco.languages.registerCompletionItemProvider(language, {
          triggerCharacters: ['.', '>', ':'],
          provideCompletionItems: async (_model, position) => {
            if (!clangdStarted) return { suggestions: [] };
            const result = await sendClangdRequest('textDocument/completion', { textDocument: { uri: currentDocumentUri }, position: positionToLsp(position) });
            const items = result && (result.items || result) || [];
            return { suggestions: items.map((item) => ({ label: item.label, kind: item.kind || monaco.languages.CompletionItemKind.Text, insertText: item.insertText || item.label, detail: item.detail })) };
          }
        });
        monaco.languages.registerHoverProvider(language, {
          provideHover: async (_model, position) => {
            if (!clangdStarted) return null;
            const result = await sendClangdRequest('textDocument/hover', { textDocument: { uri: currentDocumentUri }, position: positionToLsp(position) });
            if (!result) return null;
            const contents = Array.isArray(result.contents) ? result.contents : [result.contents];
            return { contents: contents.map((item) => ({ value: typeof item === 'string' ? item : item.value })), range: result.range && rangeToMonaco(result.range) };
          }
        });
        monaco.languages.registerDefinitionProvider(language, {
          provideDefinition: async (_model, position) => {
            if (!clangdStarted) return [];
            const result = await sendClangdRequest('textDocument/definition', { textDocument: { uri: currentDocumentUri }, position: positionToLsp(position) });
            const locations = Array.isArray(result) ? result : result ? [result] : [];
            return locations.map((location) => {
              const uri = location.targetUri || location.uri;
              const range = location.targetSelectionRange || location.targetRange || location.range;
              return { uri: monaco.Uri.parse(uri), range: rangeToMonaco(range) };
            });
          }
        });
      });

      monaco.languages.registerCompletionItemProvider('python', {
        triggerCharacters: ['.'],
        provideCompletionItems: async (_model, position) => {
          if (!pyrightStarted) return { suggestions: [] };
          const result = await sendPyrightRequest('textDocument/completion', { textDocument: { uri: currentDocumentUri }, position: positionToLsp(position) });
          const items = result && (result.items || result) || [];
          return {
            suggestions: items.map((item) => ({
              label: item.label,
              kind: item.kind || monaco.languages.CompletionItemKind.Property,
              insertText: item.insertText || item.label,
              detail: item.detail,
              documentation: typeof item.documentation === 'string' ? item.documentation : item.documentation?.value
            }))
          };
        }
      });
      monaco.languages.registerHoverProvider('python', {
        provideHover: async (_model, position) => {
          if (!pyrightStarted) return null;
          const result = await sendPyrightRequest('textDocument/hover', { textDocument: { uri: currentDocumentUri }, position: positionToLsp(position) });
          if (!result || !result.contents) return null;
          const rawContents = Array.isArray(result.contents) ? result.contents : [result.contents];
          const contents = rawContents.map((item) => ({ value: typeof item === 'string' ? item : item.value || '' }));
          return { contents, range: result.range && rangeToMonaco(result.range) };
        }
      });
      monaco.languages.registerDefinitionProvider('python', {
        provideDefinition: async (_model, position) => {
          if (!pyrightStarted) return [];
          const result = await sendPyrightRequest('textDocument/definition', { textDocument: { uri: currentDocumentUri }, position: positionToLsp(position) });
          const locations = Array.isArray(result) ? result : result ? [result] : [];
          return locations.map((location) => {
            const uri = location.targetUri || location.uri;
            const range = location.targetSelectionRange || location.targetRange || location.range;
            return { uri: monaco.Uri.parse(uri), range: rangeToMonaco(range) };
          });
        }
      });

      window.editor.onDidChangeModelContent(() => {
        const activeTab = tabManager.getActiveTab();
        if (activeTab && !activeTab.isDirty) {
          activeTab.isDirty = true;
          tabManager.render();
        }

        if (!currentDocumentUri) return;
        if (!clangdStarted && !pyrightStarted) return;
        if (changeTimeout) clearTimeout(changeTimeout);
        changeTimeout = setTimeout(() => {
          documentVersion++;
          const payload = {
            textDocument: { uri: currentDocumentUri, version: documentVersion },
            contentChanges: [{ text: window.editor.getValue() }]
          };
          if (clangdStarted && isActiveCppLanguage()) {
            sendClangdNotification('textDocument/didChange', payload);
          } else if (pyrightStarted && isActivePythonLanguage()) {
            sendPyrightNotification('textDocument/didChange', payload);
          }
        }, 150);
      });

      // Open File Event
      document.getElementById('open-btn').addEventListener('click', async () => {
        const file = await window.api.openFile();
        if (file) await openLoadedFile(file);
      });

      document.getElementById('new-btn').addEventListener('click', async () => {
        createNewTab();
      });

      async function saveTab(tab) {
        if (!tab) return false;

        const savedPath = await window.api.saveFile({ filePath: tab.filePath, content: tab.model.getValue() });
        if (!savedPath) return false;

        tab.filePath = savedPath;
        tab.title = savedPath.split(/[\\/]/).pop();
        tab.isDirty = false;

        if (tab.id === tabManager.activeTabId) {
          currentFilePath = savedPath;
          currentDocumentUri = pathToUri(savedPath);
          monaco.editor.setModelLanguage(tab.model, languageForPath(savedPath));
          updateSourceLanguageLabel();
          if (isActiveCppLanguage()) {
            if (pyrightStarted) {
              window.api.stopPyright();
              pyrightStarted = false;
            }
            if (!clangdStarted) {
              startClangdServer();
            } else {
              sendClangdNotification('textDocument/didSave', { textDocument: { uri: currentDocumentUri } });
            }
          } else if (isActivePythonLanguage()) {
            if (clangdStarted) {
              window.api.stopClangd();
              clangdStarted = false;
            }
            if (!pyrightStarted) {
              startPyrightServer();
            } else {
              sendPyrightNotification('textDocument/didSave', { textDocument: { uri: currentDocumentUri } });
            }
          } else {
            stopLanguageServers();
            clearProblems();
            document.getElementById('status').textContent = hasEditorLanguage(currentFilePath || '') ? 'language: ready' : 'language: plaintext';
          }
        }

        tabManager.render();
        return true;
      }

      // Save File Event
      document.getElementById('save-btn').addEventListener('click', async () => {
        await saveTab(tabManager.getActiveTab());
      });

      document.getElementById('save-as-btn').addEventListener('click', async () => {
        const savedPath = await window.api.saveFile({ filePath: null, content: window.editor.getValue() });
        if (savedPath) await openLoadedFile({ path: savedPath, content: window.editor.getValue() });
      });

      document.getElementById('language-select').addEventListener('change', (event) => applyInterfaceLanguage(event.target.value));
      document.getElementById('exit-btn').addEventListener('click', () => window.api.exit());
      document.getElementById('tree-root').textContent = 'Open a file to browse its folder';

      // Theme selector
      document.getElementById('theme-select').addEventListener('change', (event) => {
        applyTheme(event.target.value); 
      })

      function toggleProblemsPanel() {
        const panel = document.getElementById('problems-panel');
        const isHidden = window.getComputedStyle(panel).display === 'none';

        panel.style.display = isHidden ? 'flex' : 'none';

        requestAnimationFrame(() => {
          if (window.editor) window.editor.layout();
        });
      }

      // Open/Close Find Dialog
      let findMatches = [];
      let currentMatchIndex = -1;
      let findDecorations = [];

      function openFindDialog() {
        const dialog = document.getElementById('find-dialog');
        dialog.classList.remove('hidden');
        const input = document.getElementById('find-input');
        input.focus();
        input.select();
      }

      function closeFindDialog() {
        document.getElementById('find-dialog').classList.add('hidden');
        document.getElementById('find-input').value = '';
        findDecorations = window.editor.deltaDecorations(findDecorations, []);
        findMatches = [];
        currentMatchIndex = -1;
        window.editor.focus();
      }

      document.getElementById('find-btn').addEventListener('click', openFindDialog);
      document.getElementById('find-close-btn').addEventListener('click', closeFindDialog);
      document.getElementById('find-input').addEventListener('input', (event) => {
        performSearch(event.target.value);
      });

      document.getElementById('find-next-btn').addEventListener('click', goToNextMatch);
      document.getElementById('find-prev-btn').addEventListener('click', goToPrevMatch);

      document.getElementById('find-input').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          event.shiftKey ? goToPrevMatch() : goToNextMatch();
        } else if (event.key === 'Escape') {
          event.preventDefault();
          closeFindDialog();
        }
      });

      function performSearch(query) {
        const model = window.editor.getModel();
        findDecorations = window.editor.deltaDecorations(findDecorations, []);

        if (!query) {
          findMatches = [];
          currentMatchIndex = -1;
          updateMatchCount();
          return;
        }

        findMatches = model.findMatches(
          query,
          true,
          false,
          false,
          null,
          false
        );

        currentMatchIndex = findMatches.length > 0 ? 0 : -1;
        highlightMatches();
        goToMatch(currentMatchIndex);
        updateMatchCount();
      }

      function highlightMatches() {
        const decorations = findMatches.map((match) => ({
          range: match.range,
          options: { inlineClassName: 'find-match-highlight' }
        }));
        findDecorations = window.editor.deltaDecorations(findDecorations, decorations);
      }

      function goToMatch(index) {
        if (index < 0 || index >= findMatches.length) return;
        const range = findMatches[index].range;
        window.editor.revealRangeInCenter(range);
        window.editor.setSelection(range);
      }

      function updateMatchCount() {
        const label = document.getElementById('find-match-count');
        label.textContent = findMatches.length
          ? `${currentMatchIndex + 1}/${findMatches.length}`
          : 'No results';
      }

      function goToNextMatch() {
        if (!findMatches.length) return;
        currentMatchIndex = (currentMatchIndex + 1) % findMatches.length;
        goToMatch(currentMatchIndex);
        updateMatchCount();
      }

      function goToPrevMatch() {
        if (!findMatches.length) return;
        currentMatchIndex = (currentMatchIndex - 1 + findMatches.length) % findMatches.length;
        goToMatch(currentMatchIndex);
        updateMatchCount();
      }

      // Application shortcuts outside Monaco.
      window.addEventListener('keydown', (event) => {
        if (!event.ctrlKey || event.altKey) return;

        if (event.key.toLowerCase() === 'n') {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('new-btn').click();
        } else if (event.key.toLowerCase() === 'o') {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('open-btn').click();
        } else if (event.key.toLowerCase() === 's' && event.shiftKey) {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('save-as-btn').click();
        } else if (event.key.toLowerCase() === 's') {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('save-btn').click();
        } else if (event.key.toLowerCase() === 'k') {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('open-folder-btn').click();
        } else if (event.key.toLowerCase() === 'f') {
          event.preventDefault(); 
          event.stopImmediatePropagation(); 
          openFindDialog(); 
        }
      }, true);

      window.addEventListener('keydown', (event) => {
        if (!event.ctrlKey || event.altKey) return;

        const isPeriod = event.code === 'Period' || event.key === '.' || event.keyCode === 190;
        if (!isPeriod) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        toggleProblemsPanel();
      }, true);

      // Register Ctrl+. with Monaco as well so it works while the editor owns focus.
      window.editor.addCommand(
        monaco.KeyMod.CtrlCmd | monaco.KeyCode.Period,
        () => toggleProblemsPanel()
      );

      let resizingProblems = false;
      document.getElementById('problems-resizer').addEventListener('mousedown', () => {
        resizingProblems = true;
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
      });
      window.addEventListener('mousemove', (event) => {
        if (!resizingProblems) return;
        const workspaceBottom = document.getElementById('workspace').getBoundingClientRect().bottom;
        const height = Math.max(80, Math.min(workspaceBottom - event.clientY, window.innerHeight - 120));
        document.getElementById('problems-panel').style.height = `${height}px`;
      });
      window.addEventListener('mouseup', () => {
        if (!resizingProblems) return;
        resizingProblems = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.editor.layout();
      });

      // Apply the real Theme to Mocano now that exists
      applyTheme(savedThemeId).then(() => {
        document.getElementById('theme-select').value = savedThemeId;
      });
    });
  });
  </script>

  <div id="find-dialog" class="hidden" role="dialog" aria-label="Find in file">
    <input type="text" id="find-input" placeholder="Find..." autocomplete="off" />
    <button id="find-prev-btn" aria-label="Previous match">▲</button>
    <button id="find-next-btn" aria-label="Next match">▼</button>
    <span id="find-match-count"></span>
    <button id="find-close-btn" aria-label="Close">✕</button>
  </div>

</body>
</html>
