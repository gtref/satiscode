<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Satiscode</title>
  <style>
    :root{--background:#1e1e1e;--surface:#181818;--raised:#252526;--border:#333;--border-strong:#454545;--text:#ccc;--muted:#858585;--primary:#0e639c;--primary-hover:#1177bb;--success:#3a6f3a;--success-hover:#4b8d4b;--danger:#8f3030;--danger-hover:#b33b3b;--error:#f14c4c;--warning:#cca700;--selection:#094771}
    body{margin:0;padding:0;overflow:hidden;display:flex;flex-direction:column;height:100vh;color:var(--text);background:var(--background);font:13px sans-serif}
    #toolbar{background:var(--background);padding:6px;display:flex;gap:8px;border-bottom:1px solid var(--border)}
    button{background:var(--primary);color:#fff;border:none;padding:4px 12px;cursor:pointer;border-radius:2px}
    button:hover{background:var(--primary-hover)}
    #exit-btn{background:var(--danger)}
    #exit-btn:hover{background:var(--danger-hover)}
    #new-btn,#save-as-btn{background:var(--success)}
    #new-btn:hover,#save-as-btn:hover{background:var(--success-hover)}
    #language-select,#source-language-btn{margin-left:4px;background:var(--raised);color:var(--text);border:1px solid #444;padding:3px 6px}
    #source-language-menu{position:relative}
    #source-language-btn{margin:0;min-width:110px;text-align:left}
    #source-language-options{position:absolute;top:100%;right:0;z-index:10;min-width:180px;padding:4px;background:var(--raised);border:1px solid var(--border-strong);box-shadow:0 5px 14px #0008}
    #source-language-options[hidden]{display:none}
    .source-language-option{display:block;width:100%;background:transparent;text-align:left;padding:7px 9px;color:var(--text);border-radius:0}
    .source-language-option:hover{background:var(--selection)}
    .language-badge{display:inline-block;min-width:27px;margin-right:7px;color:#fff;font-weight:bold}
    #content{flex:1;min-height:0;display:flex}
    #file-tree{width:235px;flex:0 0 235px;background:var(--surface);border-right:1px solid var(--border);overflow:auto}
    #tree-header{padding:9px 12px;color:#bbb;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
    #tree-root{padding:5px 0}
    .tree-entry{display:flex;align-items:center;gap:6px;min-height:26px;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tree-entry:hover{background:#2a2d2e}
    .tree-entry.active{background:var(--selection);color:#fff}
    .tree-children{padding-left:15px}
    .tree-chevron{width:12px;color:#888}
    .tree-icon{width:16px}
    #workspace{flex:1;min-height:0;display:flex;flex-direction:column}
    #editor{flex:1;min-height:80px;width:100%}
    #problems-panel{height:220px;min-height:80px;display:none;flex-direction:column;border-top:1px solid var(--border-strong);background:var(--surface)}
    #problems-resizer{height:5px;flex:0 0 5px;cursor:ns-resize;background:var(--raised)}
    #problems-resizer:hover{background:var(--primary)}
    #problems-header{height:34px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--border)}
    #problems-title{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    #problems-count{color:#999}
    #problems-list{flex:1;overflow:auto}
    .problem{display:flex;gap:9px;align-items:baseline;padding:7px 12px;cursor:pointer;border-bottom:1px solid #252525}
    .problem:hover{background:#2a2d2e}
    .problem-icon{color:var(--error);font-weight:bold}
    .problem.warning .problem-icon{color:var(--warning)}
    .problem-message{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .problem-location{color:var(--muted);font-size:12px}
    #no-problems{color:var(--muted);padding:18px 12px}
    #status{color:#aaa;font:12px sans-serif;margin-left:auto;padding:5px 10px}
  </style>
  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
</head>
<body>
  <div id="toolbar">
    <button id="new-btn" data-i18n="newFile">New</button>
    <button id="open-btn" data-i18n="openFile">Open</button>
    <button id="save-btn" data-i18n="saveFile">Save</button>
    <button id="save-as-btn" data-i18n="saveAs">Save As</button>
    <button id="exit-btn" data-i18n="exit">Exit</button>
    <div id="source-language-menu">
      <button id="source-language-btn" aria-haspopup="true" aria-expanded="false"><span class="language-badge">◇</span><span id="source-language-label">Auto</span> ▾</button>
      <div id="source-language-options" hidden>
        <button class="source-language-option" data-source-language="auto"><span class="language-badge">↯</span>Auto</button>
        <button class="source-language-option" data-source-language="c"><span class="language-badge">C</span>C</button>
        <button class="source-language-option" data-source-language="cpp"><span class="language-badge">C++</span>C++</button>
        <button class="source-language-option" data-source-language="css"><span class="language-badge">#</span>CSS</button>
        <button class="source-language-option" data-source-language="javascript"><span class="language-badge">JS</span>JavaScript</button>
        <button class="source-language-option" data-source-language="html"><span class="language-badge">&lt;&gt;</span>HTML</button>
        <button class="source-language-option" data-source-language="typescript"><span class="language-badge">TS</span>TypeScript</button>
        <button class="source-language-option" data-source-language="json"><span class="language-badge">{ }</span>JSON</button>
        <button class="source-language-option" data-source-language="plaintext"><span class="language-badge">Aa</span>Plain Text</button>
      </div>
    </div>
    <select id="language-select" aria-label="Interface language">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
    <span id="status">clangd: idle</span>
  </div>
  <div id="content">
    <aside id="file-tree">
      <div id="tree-header" data-i18n="explorer">Explorer</div>
      <div id="tree-root"></div>
    </aside>
    <div id="workspace">
      <div id="editor"></div>
      <section id="problems-panel" aria-label="Problems">
        <div id="problems-resizer" title="Resize Problems panel"></div>
        <div id="problems-header">
          <span id="problems-title" data-i18n="problems">Problems</span>
          <span id="problems-count">0</span>
        </div>
        <div id="problems-list"><div id="no-problems" data-i18n="noProblems">No problems detected.</div></div>
      </section>
    </div>
  </div>
  <script>
    window.addEventListener('error', (event) => {
      console.error(`Uncaught renderer error: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`, event.error?.stack || '');
    });
    window.addEventListener('unhandledrejection', (event) => {
      console.error('Unhandled renderer promise rejection:', event.reason?.stack || event.reason);
    });

    let currentFilePath = null;
    let clangdRequestId = 0;
    let documentVersion = 1;
    const pendingRequests = new Map();
    let clangdStarted = false;
    let currentDirectory = null;
    let manualLanguage = null;
    const cppExtensions = new Set(['.c', '.cc', '.cpp', '.cxx', '.h', '.hh', '.hpp', '.hxx']);
    const languageByExtension = new Map([
      ['.html', 'html'], ['.htm', 'html'], ['.css', 'css'], ['.scss', 'scss'],
      ['.js', 'javascript'], ['.jsx', 'javascript'], ['.mjs', 'javascript'], ['.cjs', 'javascript'],
      ['.ts', 'typescript'], ['.tsx', 'typescript'], ['.json', 'json'], ['.jsonc', 'json']
    ]);
    const translations = {
      en: { newFile: 'New', openFile: 'Open', saveFile: 'Save', saveAs: 'Save As', exit: 'Exit', explorer: 'Explorer', problems: 'Problems', noProblems: 'No problems detected.' },
      es: { newFile: 'Nuevo', openFile: 'Abrir', saveFile: 'Guardar', saveAs: 'Guardar como', exit: 'Salir', explorer: 'Explorador', problems: 'Problemas', noProblems: 'No se detectaron problemas.' }
    };

    const extensionForPath = (filePath) => {
      const fileName = filePath.split(/[\\/]/).pop() || '';
      const extensionIndex = fileName.lastIndexOf('.');
      return extensionIndex >= 0 ? fileName.slice(extensionIndex).toLowerCase() : '';
    };
    const isCppFile = (filePath) => cppExtensions.has(extensionForPath(filePath));
    const languageForPath = (filePath) => {
      const extension = extensionForPath(filePath);
      if (extension === '.c') return 'c';
      if (cppExtensions.has(extension)) return 'cpp';
      return languageByExtension.get(extension) || 'plaintext';
    };
    const hasEditorLanguage = (filePath) => isCppFile(filePath) || languageByExtension.has(extensionForPath(filePath));
    const activeLanguage = (filePath) => manualLanguage || languageForPath(filePath || '');
    const isActiveCppLanguage = () => activeLanguage(currentFilePath) === 'c' || activeLanguage(currentFilePath) === 'cpp';
    const pathToUri = (filePath) => {
      const normalized = filePath.replace(/\\/g, '/');
      return encodeURI(`file://${normalized.startsWith('/') ? '' : '/'}${normalized}`);
    };
    const positionToLsp = (position) => ({ line: position.lineNumber - 1, character: position.column - 1 });
    const rangeToMonaco = (range) => ({
      startLineNumber: range.start.line + 1,
      startColumn: range.start.character + 1,
      endLineNumber: range.end.line + 1,
      endColumn: range.end.character + 1
    });
    let currentProblems = [];

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    }

    function renderProblems() {
      const panel = document.getElementById('problems-panel');
      const list = document.getElementById('problems-list');
      const count = document.getElementById('problems-count');
      count.textContent = String(currentProblems.length);
      panel.style.display = currentProblems.length ? 'flex' : 'none';
      list.innerHTML = currentProblems.length ? currentProblems.map((problem, index) => {
        const severityClass = problem.severity === monaco.MarkerSeverity.Warning ? ' warning' : '';
        const icon = problem.severity === monaco.MarkerSeverity.Warning ? '!' : '×';
        return `<div class="problem${severityClass}" data-problem-index="${index}">
          <span class="problem-icon">${icon}</span>
          <span class="problem-message">${escapeHtml(problem.message)}</span>
          <span class="problem-location">${problem.startLineNumber}:${problem.startColumn}</span>
        </div>`;
      }).join('') : '<div id="no-problems">No problems detected.</div>';
      list.querySelectorAll('.problem').forEach((element) => {
        element.addEventListener('click', () => {
          const problem = currentProblems[Number(element.dataset.problemIndex)];
          if (!problem) return;
          window.editor.setPosition({ lineNumber: problem.startLineNumber, column: problem.startColumn });
          window.editor.revealLineInCenter(problem.startLineNumber);
          window.editor.focus();
        });
      });
    }

    function clearProblems() {
      currentProblems = [];
      renderProblems();
      if (window.editor) monaco.editor.setModelMarkers(window.editor.getModel(), 'clangd', []);
    }

    function applyInterfaceLanguage(language) {
      const labels = translations[language] || translations.en;
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        element.textContent = labels[element.dataset.i18n] || element.textContent;
      });
      document.getElementById('language-select').value = translations[language] ? language : 'en';
    }

    function updateSourceLanguageLabel() {
      const language = activeLanguage(currentFilePath);
      const labels = { auto: 'Auto', c: 'C', cpp: 'C++', css: 'CSS', javascript: 'JavaScript', html: 'HTML', typescript: 'TypeScript', json: 'JSON', plaintext: 'Plain Text' };
      const icons = { auto: '◇', c: 'C', cpp: 'C++', css: '#', javascript: 'JS', html: '<>', typescript: 'TS', json: '{}', plaintext: 'Aa' };
      document.getElementById('source-language-label').textContent = labels[language] || labels.auto;
      document.querySelector('#source-language-btn .language-badge').textContent = icons[language] || icons.auto;
    }

    function applySourceLanguage(language) {
      manualLanguage = language === 'auto' ? null : language;
      const selectedLanguage = activeLanguage(currentFilePath);
      monaco.editor.setModelLanguage(window.editor.getModel(), selectedLanguage);
      updateSourceLanguageLabel();
      if (isActiveCppLanguage()) {
        startLanguageServer();
      } else if (clangdStarted) {
        if (currentFilePath) sendNotification('textDocument/didClose', { textDocument: { uri: pathToUri(currentFilePath) } });
        window.api.stopClangd();
        clangdStarted = false;
        clearProblems();
        document.getElementById('status').textContent = 'language: ready';
      } else {
        document.getElementById('status').textContent = selectedLanguage === 'plaintext' ? 'language: plaintext' : 'language: ready';
      }
    }

    async function renderDirectory(directoryPath, container) {
      container.innerHTML = '';
      const entries = await window.api.listDirectory(directoryPath);
      entries.forEach((entry) => {
        const row = document.createElement('div');
        row.className = 'tree-entry';
        row.title = entry.path;
        const chevron = document.createElement('span');
        chevron.className = 'tree-chevron';
        chevron.textContent = entry.isDirectory ? '›' : '';
        const icon = document.createElement('span');
        icon.className = 'tree-icon';
        icon.textContent = entry.isDirectory ? '▰' : '▱';
        const label = document.createElement('span');
        label.textContent = entry.name;
        row.append(chevron, icon, label);
        container.appendChild(row);
        if (entry.isDirectory) {
          const children = document.createElement('div');
          children.className = 'tree-children';
          children.hidden = true;
          row.addEventListener('click', async () => {
            children.hidden = !children.hidden;
            chevron.textContent = children.hidden ? '›' : '⌄';
            if (!children.hidden && !children.dataset.loaded) {
              children.dataset.loaded = 'true';
              await renderDirectory(entry.path, children);
            }
          });
          container.appendChild(children);
        } else {
          row.addEventListener('click', async () => {
            const file = await window.api.readFile(entry.path);
            await openLoadedFile(file);
          });
        }
      });
    }

    async function refreshFileTree(directoryPath) {
      if (!directoryPath) return;
      currentDirectory = directoryPath;
      await renderDirectory(directoryPath, document.getElementById('tree-root'));
    }

    async function openLoadedFile(file) {
      if (clangdStarted && currentFilePath) {
        sendNotification('textDocument/didClose', { textDocument: { uri: pathToUri(currentFilePath) } });
        window.api.stopClangd();
        clangdStarted = false;
      }
      currentFilePath = file.path;
      manualLanguage = null;
      currentDirectory = file.path.substring(0, Math.max(file.path.lastIndexOf('\\'), file.path.lastIndexOf('/')));
      documentVersion = 1;
      clearProblems();
      monaco.editor.setModelLanguage(window.editor.getModel(), activeLanguage(file.path));
      window.editor.setValue(file.content);
      await refreshFileTree(currentDirectory);
      if (isCppFile(file.path)) startLanguageServer();
      else document.getElementById('status').textContent = hasEditorLanguage(file.path) ? 'language: ready' : 'language: plaintext';
      updateSourceLanguageLabel();
    }

    function sendRequest(method, params) {
      const id = ++clangdRequestId;
      window.api.sendClangdMessage({ jsonrpc: '2.0', id, method, params });
      return new Promise((resolve, reject) => pendingRequests.set(id, { resolve, reject }));
    }

    function sendNotification(method, params) {
      window.api.sendClangdMessage({ jsonrpc: '2.0', method, params });
    }

    function startLanguageServer() {
      if (!currentFilePath || !isActiveCppLanguage()) return;
      if (clangdStarted) window.api.stopClangd();
      clangdStarted = true;
      document.getElementById('status').textContent = 'clangd: starting';
      const rootPath = currentFilePath.substring(0, Math.max(currentFilePath.lastIndexOf('\\'), currentFilePath.lastIndexOf('/')));
      window.api.startClangd(rootPath || undefined);
      const uri = pathToUri(currentFilePath);
      sendRequest('initialize', {
        processId: null,
        rootUri: pathToUri(rootPath),
        capabilities: {
          textDocument: {
            synchronization: { didSave: true },
            completion: { completionItem: { snippetSupport: true } }
          }
        }
      }).then(() => {
        sendNotification('initialized', {});
        sendNotification('textDocument/didOpen', {
          textDocument: { uri, languageId: activeLanguage(currentFilePath), version: documentVersion, text: window.editor.getValue() }
        });
        document.getElementById('status').textContent = 'clangd: ready';
      }).catch(() => { document.getElementById('status').textContent = 'clangd: unavailable'; });
    }

    const monacoBaseUrl = new URL('node_modules/monaco-editor/min/', window.location.href).href;
    window.MonacoEnvironment = {
      getWorkerUrl: () => `data:text/javascript;charset=utf-8,${encodeURIComponent(`
        self.MonacoEnvironment = { baseUrl: '${monacoBaseUrl}' };
        importScripts('${monacoBaseUrl}vs/base/worker/workerMain.js');
      `)}`
    };
    require.config({ paths: { 'vs': `${monacoBaseUrl}vs` }});
    require(['vs/editor/editor.main'], function() {
      window.editor = monaco.editor.create(document.getElementById('editor'), {
        value: '// Start typing CMM code or JS here...\n',
        language: 'plaintext',
        theme: 'vs-dark',
        automaticLayout: true
      });

      window.api.onClangdMessage((message) => {
        if (message.id !== undefined && pendingRequests.has(message.id)) {
          const request = pendingRequests.get(message.id);
          pendingRequests.delete(message.id);
          if (message.error) request.reject(message.error); else request.resolve(message.result);
        }
        if (message.method === 'textDocument/publishDiagnostics') {
          currentProblems = (message.params.diagnostics || []).map((diagnostic) => ({
            ...rangeToMonaco(diagnostic.range),
            message: diagnostic.message,
            severity: diagnostic.severity === 1 ? monaco.MarkerSeverity.Error : diagnostic.severity === 2 ? monaco.MarkerSeverity.Warning : monaco.MarkerSeverity.Info,
            source: 'clangd'
          }));
          monaco.editor.setModelMarkers(window.editor.getModel(), 'clangd', currentProblems);
          renderProblems();
        }
      });
      window.api.onClangdError((message) => {
        clangdStarted = false;
        pendingRequests.forEach((request) => request.reject(new Error(message)));
        pendingRequests.clear();
        console.warn(`clangd is unavailable. C/C++ editing will continue without language services: ${message}`);
        document.getElementById('status').textContent = 'clangd: unavailable';
      });
      applyInterfaceLanguage('en');
      updateSourceLanguageLabel();

      document.getElementById('source-language-btn').addEventListener('click', () => {
        const options = document.getElementById('source-language-options');
        options.hidden = !options.hidden;
        document.getElementById('source-language-btn').setAttribute('aria-expanded', String(!options.hidden));
      });
      document.querySelectorAll('[data-source-language]').forEach((option) => {
        option.addEventListener('click', () => {
          applySourceLanguage(option.dataset.sourceLanguage);
          document.getElementById('source-language-options').hidden = true;
          document.getElementById('source-language-btn').setAttribute('aria-expanded', 'false');
        });
      });
      document.addEventListener('click', (event) => {
        if (!document.getElementById('source-language-menu').contains(event.target)) {
          document.getElementById('source-language-options').hidden = true;
          document.getElementById('source-language-btn').setAttribute('aria-expanded', 'false');
        }
      });

      ['c', 'cpp'].forEach((language) => {
      monaco.languages.registerCompletionItemProvider(language, {
        triggerCharacters: ['.', '>', ':'],
        provideCompletionItems: async (_model, position) => {
          if (!clangdStarted) return { suggestions: [] };
          const result = await sendRequest('textDocument/completion', { textDocument: { uri: pathToUri(currentFilePath) }, position: positionToLsp(position) });
          const items = result && (result.items || result) || [];
          return { suggestions: items.map((item) => ({ label: item.label, kind: item.kind || monaco.languages.CompletionItemKind.Text, insertText: item.insertText || item.label, detail: item.detail })) };
        }
      });
      monaco.languages.registerHoverProvider(language, {
        provideHover: async (_model, position) => {
          if (!clangdStarted) return null;
          const result = await sendRequest('textDocument/hover', { textDocument: { uri: pathToUri(currentFilePath) }, position: positionToLsp(position) });
          if (!result) return null;
          const contents = Array.isArray(result.contents) ? result.contents : [result.contents];
          return { contents: contents.map((item) => ({ value: typeof item === 'string' ? item : item.value })), range: result.range && rangeToMonaco(result.range) };
        }
      });
      monaco.languages.registerDefinitionProvider(language, {
        provideDefinition: async (_model, position) => {
          if (!clangdStarted) return [];
          const result = await sendRequest('textDocument/definition', { textDocument: { uri: pathToUri(currentFilePath) }, position: positionToLsp(position) });
          const locations = Array.isArray(result) ? result : result ? [result] : [];
          return locations.map((location) => ({ uri: monaco.Uri.parse(location.uri), range: rangeToMonaco(location.range) }));
        }
      });
      });

      window.editor.onDidChangeModelContent(() => {
        if (!clangdStarted || !currentFilePath) return;
        documentVersion++;
        sendNotification('textDocument/didChange', {
          textDocument: { uri: pathToUri(currentFilePath), version: documentVersion },
          contentChanges: [{ text: window.editor.getValue() }]
        });
      });

      // Open File Event
      document.getElementById('open-btn').addEventListener('click', async () => {
        const file = await window.api.openFile();
        if (file) await openLoadedFile(file);
      });

      document.getElementById('new-btn').addEventListener('click', async () => {
        await openLoadedFile({ path: '', content: '' });
        currentFilePath = null;
        document.getElementById('status').textContent = 'clangd: idle';
      });

      // Save File Event
      document.getElementById('save-btn').addEventListener('click', async () => {
        const content = window.editor.getValue();
        const savedPath = await window.api.saveFile({ filePath: currentFilePath, content });
        if (savedPath) {
          const previousLanguage = currentFilePath ? languageForPath(currentFilePath) : 'plaintext';
          currentFilePath = savedPath;
          const nextLanguage = languageForPath(savedPath);
          if (previousLanguage !== nextLanguage) monaco.editor.setModelLanguage(window.editor.getModel(), nextLanguage);
          if (isActiveCppLanguage() && !clangdStarted) startLanguageServer();
          if (!isActiveCppLanguage()) document.getElementById('status').textContent = hasEditorLanguage(savedPath) ? 'language: ready' : 'language: plaintext';
        }
      });

      document.getElementById('save-as-btn').addEventListener('click', async () => {
        const savedPath = await window.api.saveFile({ filePath: null, content: window.editor.getValue() });
        if (savedPath) await openLoadedFile({ path: savedPath, content: window.editor.getValue() });
      });

      document.getElementById('language-select').addEventListener('change', (event) => applyInterfaceLanguage(event.target.value));
      document.getElementById('exit-btn').addEventListener('click', () => window.api.exit());
      document.getElementById('tree-root').textContent = 'Open a file to browse its folder';

      window.addEventListener('keydown', (event) => {
        if (!event.ctrlKey || event.altKey) return;
        if (event.key.toLowerCase() === 'n') {
          event.preventDefault();
          document.getElementById('new-btn').click();
        } else if (event.key.toLowerCase() === 'o') {
          event.preventDefault();
          document.getElementById('open-btn').click();
        } else if (event.key.toLowerCase() === 's' && event.shiftKey) {
          event.preventDefault();
          document.getElementById('save-as-btn').click();
        } else if (event.key.toLowerCase() === 's') {
          event.preventDefault();
          document.getElementById('save-btn').click();
        }
      });

      let resizingProblems = false;
      document.getElementById('problems-resizer').addEventListener('mousedown', () => {
        resizingProblems = true;
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
      });
      window.addEventListener('mousemove', (event) => {
        if (!resizingProblems) return;
        const workspaceBottom = document.getElementById('workspace').getBoundingClientRect().bottom;
        const height = Math.max(80, Math.min(workspaceBottom - event.clientY, window.innerHeight - 120));
        document.getElementById('problems-panel').style.height = `${height}px`;
      });
      window.addEventListener('mouseup', () => {
        if (!resizingProblems) return;
        resizingProblems = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.editor.layout();
      });
    });
  </script>
