<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               font-src 'self' data:;
               script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:;
               worker-src blob: data:;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;">

  <title>Satiscode</title>
  <link rel="stylesheet" href="styles/style1.css">
  <link rel="stylesheet" href="node_modules/monaco-editor/min/vs/editor/editor.main.css">
  <link rel="stylesheet" href="UI/markdown_view/style.css">
  <link id="markdown-code-theme" rel="stylesheet" href="node_modules/highlight.js/styles/github-dark.min.css">
  <script type="module">
    import { initIcons, getFileIcon, getFolderIcon, getChevronIcon, getUiIcon } from './icons.js';
    import { loadTheme, applyTheme, getAvailableThemes } from './themes.js'; 
    import { TabManager } from './UI/tab_manager/tabman.js';
    import { MarkdownView } from './UI/markdown_view/view.js';

    // Attach getters to window for internal renderer access immediately
    window.getFileIcon = getFileIcon;
    window.getFolderIcon = getFolderIcon;
    window.getChevronIcon = getChevronIcon;
    window.getUiIcon = getUiIcon;
    window.MarkdownView = MarkdownView;

    // Attach theme functions for internal renderer access
    window.loadTheme = loadTheme;
    window.applyTheme = applyTheme;
    window.getAvailableThemes = getAvailableThemes;

    let settings = await window.api.getSettings();
    const legacyTheme = localStorage.getItem('satiscode-theme');
    if (!settings.namePromptCompleted && ['dark', 'light', 'high_contrast'].includes(legacyTheme)) {
      settings = await window.api.setTheme(legacyTheme);
    }
    window.appSettings = settings;
    const savedTheme = settings.theme || 'dark';
    document.getElementById('markdown-code-theme').href = savedTheme === 'light'
      ? 'node_modules/highlight.js/styles/github.min.css'
      : 'node_modules/highlight.js/styles/github-dark.min.css';
    document.getElementById('theme-select').value = savedTheme;
    await applyTheme(savedTheme);
    window.TabManager = TabManager;

    // Initialize local icon system from icons/style1/icons.json
    await initIcons();
    document.getElementById('language-button-icon').innerHTML = getUiIcon('translate');
  </script>
</head>
<body>
  <div id="toolbar">
    <button id="new-btn" data-i18n="newFile">New</button>
    <button id="open-btn" data-i18n="openFile">Open</button>
    <button id="open-folder-btn" data-i18n="openFolder">Open Folder</button>
    <button id="save-btn" data-i18n="saveFile">Save</button>
    <button id="save-as-btn" data-i18n="saveAs">Save As</button>
    <button id="git-blame-btn" data-i18n="gitBlame" data-i18n-title="showGitBlame" data-i18n-aria="showGitBlame" title="Show Git blame for the active file" aria-label="Show Git blame">⑂ Blame</button>
    <button id="find-btn" data-i18n="find">Find</button>
    <button id="exit-btn" data-i18n="exit">Exit</button>
    <div id="source-language-menu">
      <button id="source-language-btn" aria-haspopup="true" aria-expanded="false" data-i18n-aria="sourceLanguage"><span class="language-badge">◇</span><span id="source-language-label">Auto</span> ▾</button>
      <div id="source-language-options" hidden>
        <button class="source-language-option" data-source-language="auto"><span class="language-badge">↯</span><span data-i18n="sourceAuto">Auto</span></button>
        <button class="source-language-option" data-source-language="c"><span class="language-badge">C</span><span data-i18n="sourceC">C</span></button>
        <button class="source-language-option" data-source-language="cpp"><span class="language-badge">C++</span><span data-i18n="sourceCpp">C++</span></button>
        <button class="source-language-option" data-source-language="css"><span class="language-badge">#</span><span data-i18n="sourceCss">CSS</span></button>
        <button class="source-language-option" data-source-language="javascript"><span class="language-badge">JS</span><span data-i18n="sourceJavaScript">JavaScript</span></button>
        <button class="source-language-option" data-source-language="html"><span class="language-badge">&lt;&gt;</span><span data-i18n="sourceHtml">HTML</span></button>
        <button class="source-language-option" data-source-language="typescript"><span class="language-badge">TS</span><span data-i18n="sourceTypeScript">TypeScript</span></button>
        <button class="source-language-option" data-source-language="json"><span class="language-badge">{ }</span><span data-i18n="sourceJson">JSON</span></button>
        <button class="source-language-option" data-source-language="plaintext"><span class="language-badge">Aa</span><span data-i18n="sourcePlainText">Plain Text</span></button>
        <button class="source-language-option" data-source-language="python"><span class="language-badge">Py</span><span data-i18n="sourcePython">Python</span></button>
        <button class="source-language-option" data-source-language="markdown"><span class="language-badge">MD</span><span data-i18n="sourceMarkdown">MarkDown</span></button>
      </div>
    </div>
    <select id="theme-select" aria-label="Interface Theme" data-i18n-aria="interfaceTheme">
      <option value="dark" data-i18n="darkTheme">Dark Theme</option>
      <option value="light" data-i18n="lightTheme">Light Theme</option>
      <option value="high_contrast" data-i18n="highContrastTheme">High Contrast</option>
    </select>
    <div id="language-menu">
      <button id="language-button" type="button" aria-label="Change interface language" title="Change interface language" aria-haspopup="true" aria-expanded="false">
        <span id="language-button-icon" aria-hidden="true"></span>
      </button>
      <div id="language-options" role="menu" hidden>
        <button type="button" role="menuitemradio" aria-checked="true" data-language="en">English</button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="es">Español</button>
      </div>
    </div>
    <span id="status">clangd: idle</span>
    <span id="ideStatus">
      <span class="status-indicator"></span>
      satiscode: Operational
    </span>
  </div>
  <div id="content">
    <nav id="activity-bar" aria-label="Sidebar views" data-i18n-aria="sidebarViews">
      <button class="activity-button" type="button" data-sidebar-target="file-tree" aria-label="Explorer" title="Explorer" data-i18n-title="explorer" data-i18n-aria="explorer" aria-pressed="true">▤</button>
      <button class="activity-button" type="button" data-sidebar-target="git-sidebar" aria-label="Source Control" title="Source Control" data-i18n-title="sourceControl" data-i18n-aria="sourceControl" aria-pressed="false">⑂</button>
    </nav>
    <aside id="file-tree">
      <div id="tree-header" data-i18n="explorer">Explorer</div>
      <div id="tree-root"></div>
    </aside>
    <aside id="git-sidebar" aria-label="Git controls" data-i18n-aria="gitControls" hidden>
      <div id="git-sidebar-mount"></div>
    </aside>
    <div id="workspace">
      <div id="tab-bar" class="tab-bar"></div>
      <div id="markdown-mode-controls" role="group" aria-label="Markdown view mode" data-i18n-aria="markdownViewMode" hidden>
        <button id="markdown-preview-button" type="button" data-i18n="markdownPreview" aria-pressed="true">Preview</button>
        <button id="markdown-edit-button" type="button" data-i18n="markdownEdit" aria-pressed="false">Edit</button>
      </div>
      <div id="editor"></div>
      <div id="markdown-preview" hidden></div>
      <section id="problems-panel" aria-label="Problems" data-i18n-aria="problems">
        <div id="problems-resizer" title="Resize Problems panel" data-i18n-title="resizeProblems"></div>
        <div id="problems-header">
          <span id="problems-title" data-i18n="problems">Problems</span>
          <span id="problems-count">0</span>
        </div>
        <div id="problems-list"><div id="no-problems" data-i18n="noProblems">No problems detected.</div></div>
      </section>
    </div>
  </div>

  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { 'vs': 'node_modules/monaco-editor/min/vs' } });

    require(['vs/editor/editor.main'], function (monaco) {
      window.monaco = monaco;

      window.addEventListener('error', (event) => {
        if (event.message?.includes('ResizeObserver loop completed with undelivered notifications')) {
          event.stopImmediatePropagation();
          return;
        }
        console.error(`Uncaught renderer error: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`, event.error?.stack || '');
      });
      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled renderer promise rejection:', event.reason?.stack || event.reason);
      });

      // Open Folder Event
      document.getElementById('open-folder-btn').addEventListener('click', async () => {
        const folderPath = await window.api.openFolder();
        if (folderPath) {
          currentDirectory = folderPath;
          await refreshFileTree(folderPath);
        }
      });

      document.querySelectorAll('[data-sidebar-target]').forEach((button) => {
        button.addEventListener('click', () => {
          const target = document.getElementById(button.dataset.sidebarTarget);
          const shouldShow = target.hidden;
          document.querySelectorAll('#file-tree, #git-sidebar').forEach((panel) => {
            panel.hidden = panel !== target || !shouldShow;
          });
          document.querySelectorAll('[data-sidebar-target]').forEach((item) => {
            item.setAttribute('aria-pressed', String(shouldShow && item === button));
          });
          requestAnimationFrame(() => window.editor?.layout());
        });
      });

      let currentFilePath = null;
      let clangdRequestId = 0;
      let pyrightRequestId = 0;
      let documentVersion = 1;
      let changeTimeout = null;
      const clangdPendingRequests = new Map();
      const pyrightPendingRequests = new Map();
      let clangdStarted = false;
      let pyrightStarted = false;
      let currentDirectory = null;
      let manualLanguage = null;
      let currentDocumentUri = null;
      const cppExtensions = new Set(['.c', '.cc', '.cpp', '.cxx', '.h', '.hh', '.hpp', '.hxx']);
      const languageByExtension = new Map([
        ['.html', 'html'], ['.htm', 'html'], ['.css', 'css'], ['.scss', 'scss'],
        ['.js', 'javascript'], ['.jsx', 'javascript'], ['.mjs', 'javascript'], ['.cjs', 'javascript'],
        ['.ts', 'typescript'], ['.tsx', 'typescript'], ['.json', 'json'], ['.jsonc', 'json'],
        ['.py', 'python'], ['.md', 'markdown'], ['.markdown', 'markdown']
      ]);
      const translations = {
        en: {
          newFile: 'New', openFile: 'Open', openFolder: 'Open Folder', saveFile: 'Save', saveAs: 'Save As', gitBlame: '⑂ Blame',
          showGitBlame: 'Show Git blame for the active file', find: 'Find', exit: 'Exit', explorer: 'Explorer', sourceControl: 'Source Control',
          sourceLanguage: 'Select source language', sourceAuto: 'Auto', sourceC: 'C', sourceCpp: 'C++', sourceCss: 'CSS',
          sourceJavaScript: 'JavaScript', sourceHtml: 'HTML', sourceTypeScript: 'TypeScript', sourceJson: 'JSON', sourcePlainText: 'Plain Text', sourcePython: 'Python',
          interfaceTheme: 'Interface theme', darkTheme: 'Dark Theme', lightTheme: 'Light Theme', highContrastTheme: 'High Contrast',
          changeLanguage: 'Change interface language', sidebarViews: 'Sidebar views', gitControls: 'Git controls', problems: 'Problems',
          resizeProblems: 'Resize Problems panel', noProblems: 'No problems detected', treePrompt: 'Open a file to browse its folder',
          findInFile: 'Find in file', findPlaceholder: 'Find...', previousMatch: 'Previous match', nextMatch: 'Next match', close: 'Close',
          markdownViewMode: 'Markdown view mode', markdownPreview: 'Preview', markdownEdit: 'Edit',
          gitBlameTitle: 'Git Blame', noBlameData: 'No blame data.', welcome: 'Welcome to Satiscode', namePrompt: 'What should we call you?', yourName: 'Your name',
          notNow: 'Not now', continue: 'Continue', languageReady: 'language: ready', languagePlainText: 'language: plain text',
          gitOpenSavedFile: 'Git: open a saved file first', gitError: 'Git error',
          clangdIdle: 'clangd: idle', clangdReady: 'clangd: ready', clangdStarting: 'clangd: starting', clangdUnavailable: 'clangd: unavailable',
          pyrightReady: 'pyright: ready', pyrightStarting: 'pyright: starting', pyrightUnavailable: 'pyright: unavailable',
          operational: 'satiscode: Operational', starting: 'satiscode: Starting', error: 'satiscode: Error', offline: 'satiscode: Offline'
        },
        es: {
          newFile: 'Nuevo', openFile: 'Abrir archivo', openFolder: 'Abrir carpeta', saveFile: 'Guardar', saveAs: 'Guardar como', gitBlame: '⑂ Anotaciones',
          showGitBlame: 'Mostrar las anotaciones Git del archivo activo', find: 'Buscar', exit: 'Salir', explorer: 'Explorador', sourceControl: 'Control de código fuente',
          sourceLanguage: 'Seleccionar lenguaje del archivo', sourceAuto: 'Automático', sourceC: 'C', sourceCpp: 'C++', sourceCss: 'CSS',
          sourceJavaScript: 'JavaScript', sourceHtml: 'HTML', sourceTypeScript: 'TypeScript', sourceJson: 'JSON', sourcePlainText: 'Texto sin formato', sourcePython: 'Python',
          interfaceTheme: 'Tema de la interfaz', darkTheme: 'Tema oscuro', lightTheme: 'Tema claro', highContrastTheme: 'Alto contraste',
          changeLanguage: 'Cambiar el idioma de la interfaz', sidebarViews: 'Vistas de la barra lateral', gitControls: 'Controles de Git', problems: 'Problemas',
          resizeProblems: 'Cambiar el tamaño del panel de problemas', noProblems: 'No se detectaron problemas', treePrompt: 'Abre un archivo para explorar su carpeta',
          findInFile: 'Buscar en el archivo', findPlaceholder: 'Buscar...', previousMatch: 'Coincidencia anterior', nextMatch: 'Siguiente coincidencia', close: 'Cerrar',
          markdownViewMode: 'Modo de vista de Markdown', markdownPreview: 'Vista previa', markdownEdit: 'Editar',
          gitBlameTitle: 'Anotaciones de Git', noBlameData: 'No hay datos de anotaciones.', welcome: 'Te damos la bienvenida a Satiscode', namePrompt: '¿Cómo te llamamos?', yourName: 'Tu nombre',
          notNow: 'Ahora no', continue: 'Continuar', languageReady: 'idioma: listo', languagePlainText: 'idioma: texto sin formato',
          gitOpenSavedFile: 'Git: abre primero un archivo guardado', gitError: 'Error de Git',
          clangdIdle: 'clangd: inactivo', clangdReady: 'clangd: listo', clangdStarting: 'clangd: iniciando', clangdUnavailable: 'clangd: no disponible',
          pyrightReady: 'pyright: listo', pyrightStarting: 'pyright: iniciando', pyrightUnavailable: 'pyright: no disponible',
          operational: 'satiscode: operativo', starting: 'satiscode: iniciando', error: 'satiscode: error', offline: 'satiscode: desconectado'
        }
      };

      const extensionForPath = (filePath) => {
        const fileName = filePath.split(/[\\/]/).pop() || '';
        const extensionIndex = fileName.lastIndexOf('.');
        return extensionIndex >= 0 ? fileName.slice(extensionIndex).toLowerCase() : '';
      };
      const isCppFile = (filePath) => cppExtensions.has(extensionForPath(filePath));
      const languageForPath = (filePath) => {
        const extension = extensionForPath(filePath);
        if (extension === '.c') return 'c';
        if (cppExtensions.has(extension)) return 'cpp';
        return languageByExtension.get(extension) || 'plaintext';
      };
      const hasEditorLanguage = (filePath) => isCppFile(filePath) || languageByExtension.has(extensionForPath(filePath));
      const activeLanguage = (filePath) => manualLanguage || languageForPath(filePath || '');
      const isActiveCppLanguage = () => activeLanguage(currentFilePath) === 'c' || activeLanguage(currentFilePath) === 'cpp';
      const isActivePythonLanguage = () => activeLanguage(currentFilePath) === 'python';
      const pathToUri = (filePath) => {
        const normalized = filePath.replace(/\\/g, '/');
        return encodeURI(`file://${normalized.startsWith('/') ? '' : '/'}${normalized}`);
      };
      const normalizeDocumentUri = (uri) => {
        try {
          return decodeURIComponent(uri).replace(/\\/g, '/').toLowerCase();
        } catch {
          return uri.replace(/\\/g, '/').toLowerCase();
        }
      };
      const virtualDocumentUri = (workspacePath, language) => {
        const ext = language === 'c' ? 'c' : language === 'cpp' ? 'cpp' : language === 'python' ? 'py' : 'txt';
        return pathToUri(`${workspacePath}\\untitled.${ext}`);
      };
      const positionToLsp = (position) => ({ line: position.lineNumber - 1, character: position.column - 1 });
      const rangeToMonaco = (range) => ({
        startLineNumber: range.start.line + 1,
        startColumn: range.start.character + 1,
        endLineNumber: range.end.line + 1,
        endColumn: range.end.character + 1
      });
      let currentProblems = [];

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
      }

      function renderProblems() {
        const list = document.getElementById('problems-list');
        const count = document.getElementById('problems-count');
        count.textContent = String(currentProblems.length);

        list.innerHTML = currentProblems.length ? currentProblems.map((problem, index) => {
          const severityClass = problem.severity === monaco.MarkerSeverity.Warning ? ' warning' : '';
          const icon = problem.severity === monaco.MarkerSeverity.Warning ? '!' : '×';
          return `<div class="problem${severityClass}" data-problem-index="${index}">
            <span class="problem-icon">${icon}</span>
            <span class="problem-message">${escapeHtml(problem.message)}</span>
            <span class="problem-location">${problem.startLineNumber}:${problem.startColumn}</span>
          </div>`;
        }).join('') : `<div id="no-problems">${translations[window.appSettings?.language]?.noProblems || translations.en.noProblems}${window.appSettings?.userName ? `, ${escapeHtml(window.appSettings.userName)}` : ''}.</div>`;

        list.querySelectorAll('.problem').forEach((element) => {
          element.addEventListener('click', () => {
            const problem = currentProblems[Number(element.dataset.problemIndex)];
            if (!problem) return;
            window.editor.setPosition({ lineNumber: problem.startLineNumber, column: problem.startColumn });
            window.editor.revealLineInCenter(problem.startLineNumber);
            window.editor.focus();
          });
        });
      }

      function clearProblems() {
        currentProblems = [];
        renderProblems();
        if (window.editor) {
          monaco.editor.setModelMarkers(window.editor.getModel(), 'clangd', []);
          monaco.editor.setModelMarkers(window.editor.getModel(), 'pyright', []);
        }
      }

      function setSatiscodeStatus(state, message) {
        const status = document.getElementById('ideStatus');
        const indicator = status?.querySelector('.status-indicator');

        if (!status || !indicator) return;

        status.dataset.state = state;

        const labels = translations[window.appSettings?.language] || translations.en;

        status.lastChild.textContent = ` ${message || labels[state] || labels.operational}`;
      }

      function setEditorStatus(key) {
        const status = document.getElementById('status');
        const labels = translations[window.appSettings?.language] || translations.en;
        status.dataset.translationKey = key;
        status.textContent = labels[key] || key;
      }

      function setEditorStatusMessage(message) {
        const status = document.getElementById('status');
        delete status.dataset.translationKey;
        status.textContent = message;
      }

      function applyInterfaceLanguage(language) {
        const labels = translations[language] || translations.en;
        const activeLanguage = translations[language] ? language : 'en';
        document.documentElement.lang = activeLanguage;
        document.querySelectorAll('[data-i18n]').forEach((element) => {
          element.textContent = labels[element.dataset.i18n] || element.textContent;
        });
        document.querySelectorAll('[data-i18n-aria]').forEach((element) => {
          element.setAttribute('aria-label', labels[element.dataset.i18nAria] || element.getAttribute('aria-label'));
        });
        document.querySelectorAll('[data-i18n-title]').forEach((element) => {
          element.title = labels[element.dataset.i18nTitle] || element.title;
        });
        const languageButton = document.getElementById('language-button');
        languageButton.setAttribute('aria-label', labels.changeLanguage);
        languageButton.title = labels.changeLanguage;
        document.querySelectorAll('[data-language]').forEach((option) => {
          option.setAttribute('aria-checked', String(option.dataset.language === activeLanguage));
        });
        document.getElementById('find-dialog').setAttribute('aria-label', labels.findInFile);
        document.getElementById('find-input').placeholder = labels.findPlaceholder;
        document.getElementById('find-prev-btn').setAttribute('aria-label', labels.previousMatch);
        document.getElementById('find-next-btn').setAttribute('aria-label', labels.nextMatch);
        document.getElementById('find-close-btn').setAttribute('aria-label', labels.close);
        document.getElementById('blame-close-btn').setAttribute('aria-label', labels.close);
        const treeRoot = document.getElementById('tree-root');
        if (!treeRoot.childElementCount) treeRoot.textContent = labels.treePrompt;
        const status = document.getElementById('status');
        const currentStatusKey = status.dataset.translationKey || Object.keys(labels).find((key) => Object.values(translations).some((locale) => locale[key] === status.textContent));
        if (currentStatusKey) status.textContent = labels[currentStatusKey] || status.textContent;
        const ideStatus = document.getElementById('ideStatus');
        ideStatus.lastChild.textContent = ` ${labels[ideStatus.dataset.state] || labels.operational}`;
      }

      function updateSourceLanguageLabel() {
        const language = activeLanguage(currentFilePath);
        const labels = translations[window.appSettings?.language] || translations.en;
        const languageLabels = { auto: labels.sourceAuto, c: labels.sourceC, cpp: labels.sourceCpp, css: labels.sourceCss, javascript: labels.sourceJavaScript, html: labels.sourceHtml, typescript: labels.sourceTypeScript, json: labels.sourceJson, python: labels.sourcePython, plaintext: labels.sourcePlainText };
        const icons = { auto: '◇', c: 'C', cpp: 'C++', css: '#', javascript: 'JS', html: '<>', typescript: 'TS', json: '{}', python: 'Py', plaintext: 'Aa', markdown: 'MD' };
        document.getElementById('source-language-label').textContent = languageLabels[language] || languageLabels.auto;
        document.querySelector('#source-language-btn .language-badge').textContent = icons[language] || icons.auto;
      }

      function stopLanguageServers() {
        if (clangdStarted) {
          if (currentDocumentUri) sendClangdNotification('textDocument/didClose', { textDocument: { uri: currentDocumentUri } });
          window.api.stopClangd();
          clangdStarted = false;
        }
        if (pyrightStarted) {
          if (currentDocumentUri) sendPyrightNotification('textDocument/didClose', { textDocument: { uri: currentDocumentUri } });
          window.api.stopPyright();
          pyrightStarted = false;
        }
      }

      function applySourceLanguage(language) {
        manualLanguage = language === 'auto' ? null : language;
        const selectedLanguage = activeLanguage(currentFilePath);
        
        monaco.editor.setModelLanguage(window.editor.getModel(), selectedLanguage);
        updateSourceLanguageLabel();

        if (isActiveCppLanguage()) {
          if (pyrightStarted) {
            if (currentDocumentUri) sendPyrightNotification('textDocument/didClose', { textDocument: { uri: currentDocumentUri } });
            window.api.stopPyright();
            pyrightStarted = false;
          }
          startClangdServer();
        } else if (isActivePythonLanguage()) {
          if (clangdStarted) {
            if (currentDocumentUri) sendClangdNotification('textDocument/didClose', { textDocument: { uri: currentDocumentUri } });
            window.api.stopClangd();
            clangdStarted = false;
          }
          startPyrightServer();
        } else {
          stopLanguageServers();
          clearProblems();
          setEditorStatus(selectedLanguage === 'plaintext' ? 'languagePlainText' : 'languageReady');
        }
      }

      async function renderDirectory(directoryPath, container) {
        container.innerHTML = '';
        const entries = await window.api.listDirectory(directoryPath);
        entries.forEach((entry) => {
          const row = document.createElement('div');
          row.className = 'tree-entry';
          row.title = entry.path;
          
          const chevron = document.createElement('span');
          chevron.className = 'tree-chevron';
          chevron.innerHTML = entry.isDirectory ? window.getChevronIcon(false) : '';
          
          const icon = document.createElement('span');
          icon.className = 'tree-icon';
          icon.innerHTML = entry.isDirectory ? window.getFolderIcon(false) : window.getFileIcon(entry.name);
          
          const label = document.createElement('span');
          label.textContent = entry.name;
          
          row.append(chevron, icon, label);
          container.appendChild(row);
          
          if (entry.isDirectory) {
            const children = document.createElement('div');
            children.className = 'tree-children';
            children.hidden = true;
            
            row.addEventListener('click', async () => {
              children.hidden = !children.hidden;
              chevron.innerHTML = window.getChevronIcon(!children.hidden);
              icon.innerHTML = window.getFolderIcon(!children.hidden);
              
              if (!children.hidden && !children.dataset.loaded) {
                children.dataset.loaded = 'true';
                await renderDirectory(entry.path, children);
              }
            });
            container.appendChild(children);
          } else {
            row.addEventListener('click', async () => {
              const file = await window.api.readFile(entry.path);
              await openLoadedFile(file);
            });
          }
        });
      }

      let untitledCounter = 1;

      function createNewTab() {
        manualLanguage = null;

      async function openLoadedFile(file) {
    if (!file) return;

    const filePath = file.path || '';
    const content = file.content ?? '';
    const fileName = filePath ? filePath.split(/[\\/]/).pop() : 'Untitled';

    const existingTab = filePath ? tabManager.getTabByFilePath(filePath) : null;
    if (existingTab) {
      tabManager.setActive(existingTab.id);
    } else {
      const lang = activeLanguage(filePath);
      const uri = filePath ? monaco.Uri.file(filePath) : undefined;

      let model = uri ? monaco.editor.getModel(uri) : null;
      if (!model) {
        model = monaco.editor.createModel(content, lang, uri);
      } else {
        model.setValue(content);
      }

      tabManager.openTab(filePath, model, fileName);
    }

    if (filePath) {
      const lastSeparator = Math.max(filePath.lastIndexOf('\\'), filePath.lastIndexOf('/'));
      if (lastSeparator !== -1) {
        currentDirectory = filePath.substring(0, lastSeparator);
        await refreshFileTree(currentDirectory);
      }
    }
  }

      function sendClangdRequest(method, params) {
        const id = ++clangdRequestId;
        window.api.sendClangdMessage({ jsonrpc: '2.0', id, method, params });
        return new Promise((resolve, reject) => clangdPendingRequests.set(id, { resolve, reject }));
      }

      function sendClangdNotification(method, params) {
        window.api.sendClangdMessage({ jsonrpc: '2.0', method, params });
      }

      function sendPyrightRequest(method, params) {
        const id = ++pyrightRequestId;
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            pyrightPendingRequests.delete(id);
            reject(new Error(`Pyright request timed out: ${method}`));
          }, 15000);
          pyrightPendingRequests.set(id, {
            resolve: (result) => { clearTimeout(timeout); resolve(result); },
            reject: (error) => { clearTimeout(timeout); reject(error); }
          });
          window.api.sendPyrightMessage({ jsonrpc: '2.0', id, method, params });
        });
      }

      function sendPyrightNotification(method, params) {
        window.api.sendPyrightMessage({ jsonrpc: '2.0', method, params });
      }

      function sendRequest(method, params) {
        if (isActivePythonLanguage()) return sendPyrightRequest(method, params);
        return sendClangdRequest(method, params);
      }

      function sendNotification(method, params) {
        if (isActivePythonLanguage()) return sendPyrightNotification(method, params);
        return sendClangdNotification(method, params);
      }

      async function startClangdServer() {
        if (!isActiveCppLanguage()) return;
        if (clangdStarted) window.api.stopClangd();
        clangdStarted = true;
        setEditorStatus('clangdStarting');
        const language = activeLanguage(currentFilePath);
        const workspacePath = currentDirectory || await window.api.getWorkspacePath();
        const rootPath = currentFilePath ? currentFilePath.substring(0, Math.max(currentFilePath.lastIndexOf('\\'), currentFilePath.lastIndexOf('/'))) : workspacePath;
        currentDocumentUri = currentDocumentUri || virtualDocumentUri(workspacePath, language);
        console.info(`Starting clangd for ${currentDocumentUri} as ${language}`);
        window.api.startClangd(rootPath || undefined).then(() => sendClangdRequest('initialize', {
            processId: null,
            rootUri: pathToUri(rootPath),
            capabilities: {
              textDocument: {
                synchronization: { didSave: true },
                completion: { completionItem: { snippetSupport: true } },
                hover: { contentFormat: ['markdown', 'plaintext'] },
                definition: {}
              }
            }
          })).then(() => {
          sendClangdNotification('initialized', {});
          sendClangdNotification('textDocument/didOpen', {
            textDocument: { uri: currentDocumentUri, languageId: language, version: documentVersion, text: window.editor.getValue() }
          });
          setEditorStatus('clangdReady');
        }).catch((error) => {
          clangdStarted = false;
          console.warn(`clangd is unavailable. C/C++ editing will continue without language services: ${error.message || error}`);
          setEditorStatus('clangdUnavailable');
        });
      }

      async function startPyrightServer() {
        if (!isActivePythonLanguage()) return;
        if (pyrightStarted) window.api.stopPyright();
        pyrightStarted = true;
        setEditorStatus('pyrightStarting');
        const language = 'python';
        const workspacePath = currentDirectory || await window.api.getWorkspacePath();
        const rootPath = currentFilePath ? currentFilePath.substring(0, Math.max(currentFilePath.lastIndexOf('\\'), currentFilePath.lastIndexOf('/'))) : workspacePath;
        currentDocumentUri = currentDocumentUri || virtualDocumentUri(workspacePath, language);
        console.info(`Starting pyright for ${currentDocumentUri} as ${language}`);
        window.api.startPyright(rootPath || undefined).then(() => sendPyrightRequest('initialize', {
            processId: null,
            rootUri: pathToUri(rootPath),
            capabilities: {
              textDocument: {
                synchronization: { didSave: true },
                completion: { completionItem: { snippetSupport: true } },
                hover: { contentFormat: ['markdown', 'plaintext'] },
                definition: {}
              }
            }
          })).then(() => {
          sendPyrightNotification('initialized', {});
          sendPyrightNotification('textDocument/didOpen', {
            textDocument: { uri: currentDocumentUri, languageId: language, version: documentVersion, text: window.editor.getValue() }
          });
          setEditorStatus('pyrightReady');
          console.info(`Pyright ready for ${currentDocumentUri}`);
        }).catch((error) => {
          pyrightStarted = false;
          console.warn(`pyright is unavailable. Python editing will continue without language services: ${error.message || error}`);
          setEditorStatus('pyrightUnavailable');
        });

      window.api.onClangdMessage((message) => {
        if (message.id !== undefined && clangdPendingRequests.has(message.id)) {
          const request = clangdPendingRequests.get(message.id);
          clangdPendingRequests.delete(message.id);
          if (message.error) request.reject(message.error); else request.resolve(message.result);
        }
        if (message.method === 'textDocument/publishDiagnostics') {
          currentProblems = (message.params.diagnostics || []).map((diagnostic) => ({
            ...rangeToMonaco(diagnostic.range),
            message: diagnostic.message,
            severity: diagnostic.severity === 1 ? monaco.MarkerSeverity.Error : diagnostic.severity === 2 ? monaco.MarkerSeverity.Warning : monaco.MarkerSeverity.Info,
            source: 'clangd'
          }));
          monaco.editor.setModelMarkers(window.editor.getModel(), 'clangd', currentProblems);
          renderProblems();
        }
      });
      window.api.onClangdError((message) => {
        clangdStarted = false;
        clangdPendingRequests.forEach((request) => request.reject(new Error(message)));
        clangdPendingRequests.clear();
        console.warn(`clangd is unavailable. C/C++ editing will continue without language services: ${message}`);
        setEditorStatus('clangdUnavailable');

        if (message.id !== undefined && pyrightPendingRequests.has(message.id)) {
          const request = pyrightPendingRequests.get(message.id);
          pyrightPendingRequests.delete(message.id);
          if (message.error) request.reject(message.error); else request.resolve(message.result);
        }
        if (message.method === 'textDocument/publishDiagnostics') {
          const diagUri = message.params?.uri;
          if (currentDocumentUri && diagUri && normalizeDocumentUri(diagUri) !== normalizeDocumentUri(currentDocumentUri)) {
            return;
          }
          currentProblems = (message.params?.diagnostics || []).map((diagnostic) => ({

      function openFindDialog() {

      function performSearch(query) {
        const model = window.editor.getModel();
        findDecorations = window.editor.deltaDecorations(findDecorations, []);

        if (!query) {
          findMatches = [];
          currentMatchIndex = -1;
          updateMatchCount();
          return;
        }

        findMatches = model.findMatches(
          query,
          true,
          false,
          false,
          null,
          false
        );

        currentMatchIndex = findMatches.length > 0 ? 0 : -1;
        highlightMatches();
        goToMatch(currentMatchIndex);
        updateMatchCount();
      }

      function highlightMatches() {
        const decorations = findMatches.map((match) => ({
          range: match.range,
          options: { inlineClassName: 'find-match-highlight' }
        }));
        findDecorations = window.editor.deltaDecorations(findDecorations, decorations);
      }

      function goToMatch(index) {
        if (index < 0 || index >= findMatches.length) return;
        const range = findMatches[index].range;
        window.editor.revealRangeInCenter(range);
        window.editor.setSelection(range);
      }

      function updateMatchCount() {
        const label = document.getElementById('find-match-count');
        label.textContent = findMatches.length
          ? `${currentMatchIndex + 1}/${findMatches.length}`
          : 'No results';
      }

      function goToNextMatch() {
        if (!findMatches.length) return;
        currentMatchIndex = (currentMatchIndex + 1) % findMatches.length;
        goToMatch(currentMatchIndex);
        updateMatchCount();
      }

      function goToPrevMatch() {
        if (!findMatches.length) return;
        currentMatchIndex = (currentMatchIndex - 1 + findMatches.length) % findMatches.length;
        goToMatch(currentMatchIndex);
        updateMatchCount();
      }

      // Application shortcuts outside Monaco.
      window.addEventListener('keydown', (event) => {
        if (!event.ctrlKey || event.altKey) return;

        if (event.key.toLowerCase() === 'n') {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('new-btn').click();
        } else if (event.key.toLowerCase() === 'o') {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('open-btn').click();
        } else if (event.key.toLowerCase() === 's' && event.shiftKey) {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('save-as-btn').click();
        } else if (event.key.toLowerCase() === 's') {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('save-btn').click();
        } else if (event.key.toLowerCase() === 'k') {
          event.preventDefault();
          event.stopImmediatePropagation();
          document.getElementById('open-folder-btn').click();
        } else if (event.key.toLowerCase() === 'f') {
          event.preventDefault(); 
          event.stopImmediatePropagation(); 
          openFindDialog(); 
        }
      }, true);

      window.addEventListener('keydown', (event) => {
        if (!event.ctrlKey || event.altKey) return;

        const isPeriod = event.code === 'Period' || event.key === '.' || event.keyCode === 190;
        if (!isPeriod) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        toggleProblemsPanel();
      }, true);

      // Register Ctrl+. with Monaco as well so it works while the editor owns focus.
      window.editor.addCommand(
        monaco.KeyMod.CtrlCmd | monaco.KeyCode.Period,
        () => toggleProblemsPanel()
      );

      let resizingProblems = false;
      document.getElementById('problems-resizer').addEventListener('mousedown', () => {
        resizingProblems = true;
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
      });
      window.addEventListener('mousemove', (event) => {
        if (!resizingProblems) return;
        const workspaceBottom = document.getElementById('workspace').getBoundingClientRect().bottom;
        const height = Math.max(80, Math.min(workspaceBottom - event.clientY, window.innerHeight - 120));
        document.getElementById('problems-panel').style.height = `${height}px`;
      });
      window.addEventListener('mouseup', () => {
        if (!resizingProblems) return;
        resizingProblems = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.editor.layout();
      });

      // Apply the real Theme to Mocano now that exists
      applyTheme(savedThemeId).then(() => {
        document.getElementById('theme-select').value = savedThemeId;
      });

      const nameDialog = document.getElementById('name-setup-dialog');
      const nameInput = document.getElementById('user-name-input');
      nameDialog.addEventListener('cancel', (event) => event.preventDefault());
      document.getElementById('name-setup-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        window.appSettings = await window.api.setUserName(nameInput.value);
        nameDialog.close();
        renderProblems();
      });
      document.getElementById('skip-name-setup').addEventListener('click', async () => {
        window.appSettings = await window.api.setUserName('');
        nameDialog.close();
      });
      if (!window.appSettings?.namePromptCompleted) {
        nameDialog.showModal();
        nameInput.focus();
      }
    });
  });
  </script>

  <div id="find-dialog" class="hidden" role="dialog" aria-label="Find in file" data-i18n-aria="findInFile">
    <input type="text" id="find-input" placeholder="Find..." autocomplete="off" />
    <button id="find-prev-btn" aria-label="Previous match">▲</button>
    <button id="find-next-btn" aria-label="Next match">▼</button>
    <span id="find-match-count"></span>
    <button id="find-close-btn" aria-label="Close">✕</button>
  </div>

  <dialog id="blame-dialog" aria-labelledby="blame-title">
    <header class="blame-header">
      <h2 id="blame-title" data-i18n="gitBlameTitle">Git Blame</h2>
      <button id="blame-close-btn" type="button" aria-label="Close Git blame" data-i18n-aria="close">×</button>
    </header>
    <pre id="blame-output"></pre>
  </dialog>
  <dialog id="name-setup-dialog" aria-labelledby="name-setup-title">
    <form id="name-setup-form">
      <h2 id="name-setup-title" data-i18n="welcome">Welcome to Satiscode</h2>
      <p data-i18n="namePrompt">What should we call you?</p>
      <label for="user-name-input" data-i18n="yourName">Your name</label>
      <input id="user-name-input" name="userName" type="text" maxlength="80" autocomplete="nickname" required>
      <div class="name-setup-actions">
        <button id="skip-name-setup" type="button" data-i18n="notNow">Not now</button>
        <button type="submit" data-i18n="continue">Continue</button>
      </div>
    </form>
  </dialog>
  <script>
    document.getElementById('blame-close-btn').addEventListener('click', () => {
      document.getElementById('blame-dialog').close();
    });
  </script>

</body>
</html>
